<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>妈妈生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05060c;color:#fff}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
#hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:6;
  text-align:center;font-size:14px;letter-spacing:.08em;color:#9fb4d6;
  text-shadow:0 2px 12px rgba(0,0,0,.8);transition:opacity .5s;pointer-events:none}
#hint.hide{opacity:0}
.chip{display:inline-block;margin:0 4px;padding:4px 10px;border-radius:999px;
  border:1px solid rgba(140,180,255,.28);background:rgba(18,26,46,.55);color:#cfe0ff;font-size:12px}
#top{position:fixed;left:0;right:0;top:max(16px,env(safe-area-inset-top));z-index:6;text-align:center;
  font-size:12px;letter-spacing:.34em;color:rgba(168,196,240,.5);pointer-events:none}
#cardModal{position:fixed;inset:0;z-index:20;display:none;place-items:center;
  background:rgba(3,5,12,.82);backdrop-filter:blur(10px);padding:24px}
#cardModal.on{display:grid}
#cardModal img{max-width:min(88vw,720px);max-height:76vh;border-radius:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(160,200,255,.22)}
#cardModal .cap{margin-top:14px;font-size:14px;color:#a9c1e6;letter-spacing:.1em;text-align:center}
#cardModal .x{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(160,200,255,.3);background:rgba(20,28,48,.7);color:#cfe0ff;font-size:18px;
  line-height:36px;text-align:center;cursor:pointer}
#stage{position:fixed;inset:0;z-index:4;pointer-events:none}
.card3{position:absolute;width:200px;height:142px;border-radius:14px;overflow:hidden;
  border:1px solid rgba(255,232,190,.34);box-shadow:0 18px 44px rgba(0,0,0,.62),
  inset 0 0 30px rgba(255,200,130,.10);background:rgba(24,20,26,.74);pointer-events:none;
  transition:opacity .6s;backface-visibility:hidden}
.card3 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2}
.card3 .ph{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;
  font-size:12px;color:#f2e2c8;letter-spacing:.18em;padding-bottom:10px;
  background:linear-gradient(160deg,rgba(96,74,64,.5),rgba(24,20,26,.94) 74%)}
.card3 .ph::before{content:'';position:absolute;left:10px;right:10px;top:10px;bottom:28px;border-radius:8px;
  background:radial-gradient(circle at 50% 42%,rgba(255,216,164,.18),rgba(255,216,164,.03) 72%);
  box-shadow:inset 0 0 0 1px rgba(255,228,184,.15)}
.card3.hot{border-color:rgba(255,236,180,.98);box-shadow:0 0 0 2px rgba(255,226,150,.5),
  0 22px 52px rgba(255,200,120,.4)}

/* 实体蛋糕入场：从粒子态「结」成实体 */
@keyframes mbIn{
  0%{opacity:0;transform:scale(.93);filter:blur(6px)}
  55%{opacity:1;filter:blur(1.5px)}
  100%{opacity:1;transform:scale(1);filter:blur(0)}
}
.solidIn{animation:mbIn 1.25s cubic-bezier(.16,.9,.3,1) forwards}
/* 蜡烛暖光呼吸 */
@keyframes mbBloom{
  0%,100%{opacity:.55;transform:scale(1)}
  50%{opacity:1;transform:scale(1.06)}
}

/* 照片墙阶段：深空星场（在 canvas 之上、卡片之下） */
#sky{position:fixed;inset:-14%;z-index:3;pointer-events:none;opacity:0;
  transition:opacity 1.8s ease;will-change:transform,opacity;
  background-image:
    radial-gradient(1.5px 1.5px at 18% 24%,rgba(255,255,255,.95),transparent),
    radial-gradient(1.1px 1.1px at 62% 71%,rgba(206,224,255,.85),transparent),
    radial-gradient(1.3px 1.3px at 84% 38%,rgba(255,236,206,.8),transparent),
    radial-gradient(1px 1px at 33% 86%,rgba(255,255,255,.7),transparent),
    radial-gradient(1.7px 1.7px at 47% 12%,rgba(255,255,255,.9),transparent),
    radial-gradient(1px 1px at 92% 78%,rgba(190,214,255,.7),transparent);
  background-size:230px 230px,310px 310px,420px 420px,180px 180px,540px 540px,260px 260px;
  background-repeat:repeat,repeat,repeat,repeat,repeat,repeat;
  animation:skyDrift 150s linear infinite}
#sky::after{content:'';position:absolute;inset:0;
  background-image:radial-gradient(2.6px 2.6px at 27% 41%,rgba(255,255,255,.95),transparent),
    radial-gradient(2.2px 2.2px at 73% 19%,rgba(255,240,214,.9),transparent),
    radial-gradient(2.4px 2.4px at 55% 79%,rgba(214,228,255,.9),transparent);
  background-size:680px 680px,880px 880px,760px 760px;
  animation:skyTwinkle 7s ease-in-out infinite alternate}
body.skyon #sky{opacity:1}
@keyframes skyDrift{from{transform:translate3d(0,0,0) scale(1.04)}to{transform:translate3d(-160px,110px,0) scale(1.04)}}
@keyframes skyTwinkle{from{opacity:.55}to{opacity:1}}
</style>
</head>

<body>
<div id="sky"></div>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="stage"></div>
<div id="top">MOM &middot; HAPPY BIRTHDAY</div>
<div id="hint"></div>
<div id="cardModal"><span class="x">&times;</span><img alt=""><div class="cap"></div></div>
<script>
'use strict';
var CV = document.getElementById('c');
var STAGE3 = document.getElementById('stage');
var HINT = document.getElementById('hint');
var NARROW = innerWidth < 820;
var COUNT = NARROW ? 78000 : 200000;
var DPR = Math.min(NARROW ? 2 : 1.75, devicePixelRatio || 1);
var gl = CV.getContext('webgl2', { antialias: true, alpha: false, preserveDrawingBuffer: true })
      || CV.getContext('webgl', { antialias: true, alpha: false });

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function ease(t) { t = clamp(t, 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); }

var W = 1, H = 1, ASP = 1;
function resize() {
  W = CV.clientWidth; H = CV.clientHeight; ASP = W / H;
  CV.width = Math.round(W * DPR); CV.height = Math.round(H * DPR);
  gl.viewport(0, 0, CV.width, CV.height);
  SHAPE.dirty = true;
}
addEventListener('resize', function () { clearTimeout(window.__rz); window.__rz = setTimeout(resize, 180); });
</script>
<script>
'use strict';
var VS = [
'attribute vec3 aA;','attribute vec3 aB;','attribute vec3 aSeed;','attribute vec3 aTint;',
'uniform float uMorph, uTime, uAspect, uSize, uDpr, uBright, uBoom, uBoomT, uWarm, uTint, uScaleX;',
'varying vec3 vCol;','varying float vA;',
'void main(){',
'  vec3 p = mix(aA, aB, uMorph);',
 '  float mm = sin(uMorph * 3.14159265);',
 '  vec2 arc = aB.xy - aA.xy;',
 '  p.xy += vec2(-arc.y, arc.x) * 0.20 * mm * (0.30 + aSeed.z * 0.95);',
 '  p.z  += (aSeed.y - 0.5) * 0.60 * mm;',
'  p.x += sin(uTime*1.5 + aSeed.x*12.0)*0.0032;',
'  p.y += cos(uTime*1.2 + aSeed.y*12.0)*0.0032;',
'  vec3 dir = normalize(vec3(aSeed.xy-0.5, aSeed.z-0.5) + 0.0001);',
'  p += dir * uBoom * exp(-uBoomT*2.4);',
'  float persp = 1.0/(1.0 - p.z*0.22);',
'  vec2 q = p.xy * persp;',
'  q.x *= uScaleX;',
'  gl_Position = vec4(q, 0.0, 1.0);',
'  gl_PointSize = clamp(uSize*uDpr*(0.45+aSeed.z*1.05)*persp, 0.9, 14.0*uDpr);',
'  float gx = clamp(p.x*0.5+0.55, 0.0, 1.0);',
'  vec3 blue  = vec3(0.26,0.58,1.00);',
'  vec3 violet= vec3(0.66,0.48,1.00);',
'  vec3 rose  = vec3(1.00,0.66,0.74);',
'  vec3 gold  = vec3(1.00,0.84,0.55);',
'  vec3 choc  = vec3(0.94,0.66,0.40);',
'  vec3 c = mix(blue, violet, smoothstep(0.05,0.58,gx));',
'  c = mix(c, rose, smoothstep(0.55,1.0,gx));',
'  c = mix(c, gold, aSeed.y*0.30);',
'  c = mix(c, choc, uWarm);',
'  c = mix(c, aTint, uTint);',
'  float tw = 0.70 + 0.30*sin(uTime*(1.2+aSeed.z*2.4) + aSeed.x*22.0);',
'  float depth = 0.62 + 0.38*clamp(p.z*1.6+0.5, 0.0, 1.0);',
'  vCol = c * uBright * tw * depth;',
'  vA = (0.20 + 0.34*aSeed.z) * tw;',
'}'].join('\n');
var FS = [
'precision mediump float;',
'varying vec3 vCol;','varying float vA;',
'void main(){',
'  vec2 d = gl_PointCoord - 0.5;',
'  float r = dot(d,d);',
'  if (r > 0.25) discard;',
'  float a = smoothstep(0.25, 0.02, r) * vA;',
'  gl_FragColor = vec4(vCol * a, a);',
'}'].join('\n');
function sh(t, src) {
  var s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}
var PROG = gl.createProgram();
gl.attachShader(PROG, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(PROG, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(PROG);
if (!gl.getProgramParameter(PROG, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(PROG));
gl.useProgram(PROG);
function attrBuf(name, n) {
  var b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(COUNT * n), gl.DYNAMIC_DRAW);
  var loc = gl.getAttribLocation(PROG, name);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 0, 0);
  return b;
}
var bufA = attrBuf('aA', 3), bufB = attrBuf('aB', 3);
var bufSeed = (function () {
  var a = new Float32Array(COUNT * 3);
  for (var i = 0; i < COUNT; i++) { a[i*3] = Math.random(); a[i*3+1] = Math.random(); a[i*3+2] = Math.random(); }
  var b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, a, gl.STATIC_DRAW);
  var l = gl.getAttribLocation(PROG, 'aSeed');
  gl.enableVertexAttribArray(l);
  gl.vertexAttribPointer(l, 3, gl.FLOAT, false, 0, 0);
  return b;
})();
var bufTint = attrBuf('aTint', 3);
var U = {};
['uMorph','uTime','uAspect','uSize','uDpr','uBright','uBoom','uBoomT','uWarm','uTint','uScaleX'].forEach(function (k) {
  U[k] = gl.getUniformLocation(PROG, k);
});
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE);
gl.disable(gl.DEPTH_TEST);
var P = { morph: 0, time: 0, size: 1.15, bright: 1.0, boom: 0, boomT: 9, warm: 0, tint: 0, scaleX: 1 };
var SHAPE = { A: new Float32Array(COUNT*3), B: new Float32Array(COUNT*3), dirty: false, tintTo: 0 };
var CUR = null;
</script>
<script>
'use strict';
var TCV = document.createElement('canvas'), TCX = TCV.getContext('2d', { willReadFrequently: true });

function textPts(str, opt) {
  opt = opt || {};
  var fs0 = 380, pad = 56;
  var fam = '"Microsoft YaHei","PingFang SC","SimHei",sans-serif';
  var probe = document.createElement("canvas").getContext("2d");
  probe.font = "800 " + fs0 + "px " + fam;
  var tw = Math.ceil(probe.measureText(str).width);
  var cv = document.createElement("canvas");
  cv.width = Math.max(16, tw + pad * 2);
  cv.height = Math.max(16, Math.ceil(fs0 * 1.30) + pad * 2);
  var cx = cv.getContext("2d");
  cx.font = "800 " + fs0 + "px " + fam;
  cx.textAlign = "center"; cx.textBaseline = "middle";
  cx.fillStyle = "#fff";
  cx.fillText(str, cv.width / 2, cv.height / 2);
  var data = cx.getImageData(0, 0, cv.width, cv.height).data;
  // 自适应采样步长：先粗数一次墨迹像素，再按 COUNT 反推步长，保证「每个采样点都能分到粒子」
  var ink = 0, step0 = 4;
  for (var y0 = 0; y0 < cv.height; y0 += step0) {
    for (var x0 = 0; x0 < cv.width; x0 += step0) {
      if (data[(y0 * cv.width + x0) * 4 + 3] > 46) ink++;
    }
  }
  var want = Math.max(1200, Math.floor(COUNT * 0.92));
  var step = Math.max(1, Math.min(6, Math.round(step0 * Math.sqrt(Math.max(1, ink) / want))));
  var pts = [];
  for (var y = 0; y < cv.height; y += step) {
    for (var x = 0; x < cv.width; x += step) {
      if (data[(y * cv.width + x) * 4 + 3] > 46) pts.push(x, y);
    }
  }
  var out = new Float32Array(COUNT * 3);
  var np = pts.length / 2;
  if (!np) return out;
  var sc = Math.min(W * (opt.w || 0.86) / cv.width, H * (opt.k || 0.32) / cv.height);
  var zs = opt.z || 0.22;
  var dyy = (opt.dy || 0) * H;
  for (var k = 0; k < COUNT; k++) {
    var j = (Math.random() * np | 0) * 2;
    var ex = (pts[j] - cv.width / 2) * sc + W / 2 + rnd(-0.6, 0.6);
    var ey = (pts[j + 1] - cv.height / 2) * sc + H / 2 + dyy + rnd(-0.6, 0.6);
    out[k * 3] = ex / W * 2 - 1;
    out[k * 3 + 1] = 1 - ey / H * 2;
    out[k * 3 + 2] = rnd(-zs, zs);
  }
  window.__dbg = { np: np, sc: sc, step: step, ink: ink, cvw: cv.width, cvh: cv.height, count: COUNT };
  return out;
}

function twoLinePts(a, b, o1, o2) {
  var A = textPts(a, o1), B = textPts(b, o2);
  var out = new Float32Array(COUNT * 3), h = COUNT >> 1;
  for (var k = 0; k < COUNT; k++) {
    var src = k < h ? A : B, idx = (k % h) * 3;
    out[k * 3] = src[idx]; out[k * 3 + 1] = src[idx + 1]; out[k * 3 + 2] = src[idx + 2];
  }
  return out;
}
function cakePts() {
  var out = new Float32Array(COUNT * 3);
  var grp = new Uint8Array(COUNT);
  var R = 0.335, cy = -0.03, hh = 0.42, FLAT = 0.26;
  var topY = cy + hh / 2, botY = cy - hh / 2;
  var i = 0;
  function push(x, y, z, g) { out[i*3] = x; out[i*3+1] = y; out[i*3+2] = z; grp[i] = g; i++; }
  var nBody = Math.floor(COUNT * 0.40), nTop = Math.floor(COUNT * 0.20);
  var nDrip = Math.floor(COUNT * 0.11), nBoard = Math.floor(COUNT * 0.10);
  var nCand = COUNT - nBody - nTop - nDrip - nBoard;
  for (var a = 0; a < nBody; a++) {
    var ang = Math.random() * Math.PI * 2;
    var t = Math.random();
    var yy = botY + t * hh;
    var shell = Math.random() < 0.55;
    var RR = R * (shell ? (1 - 0.020 * Math.pow(Math.random(), 4)) : (0.30 + 0.70 * Math.sqrt(Math.random())));
    var rx = Math.cos(ang) * RR, rz = Math.sin(ang) * RR;
    var capK = 1 - 0.055 * Math.pow(Math.abs(t * 2 - 1), 8);
    push(rx * capK, yy + rz * FLAT, rz, 0);
  }
  for (var b = 0; b < nTop; b++) {
    var an = Math.random() * Math.PI * 2;
    var rad = R * Math.sqrt(Math.random()) * 0.995;
    var dome = 0.022 * (1 - Math.pow(rad / R, 2));
    var zz = Math.sin(an) * rad;
    push(Math.cos(an) * rad, topY + dome + zz * FLAT, zz, 1);
  }
  for (var c = 0; c < nDrip; c++) {
    var an3 = Math.random() * Math.PI * 2;
    var scallop = 0.5 + 0.5 * Math.sin(an3 * 12.0);
    var rr3 = R * (1.002 + 0.010 * scallop);
    var zz3 = Math.sin(an3) * rr3;
    var hang = Math.pow(Math.random(), 1.4) * (0.020 + 0.030 * scallop);
    push(Math.cos(an3) * rr3, topY - hang + zz3 * FLAT, zz3, 2);
  }
  for (var d = 0; d < nBoard; d++) {
    var an4 = Math.random() * Math.PI * 2;
    var rb = R * 1.28 * Math.sqrt(Math.random());
    var zz4 = Math.sin(an4) * rb;
    push(Math.cos(an4) * rb, botY - 0.022 + zz4 * FLAT, zz4, 3);
  }
  var cxx = 0.0, czz = 0.0, candH = 0.180;
  for (var e = 0; e < nCand; e++) {
    var tt = Math.random(), aa2 = Math.random() * Math.PI * 2, rad2 = 0.0132;
    push(cxx + Math.cos(aa2) * rad2, topY + 0.020 + tt * candH, czz + Math.sin(aa2) * rad2, 4);
  }
  var TC = [[0.86,0.50,0.26],[0.99,0.93,0.79],[0.99,0.92,0.76],[0.42,0.24,0.12],[0.97,0.92,0.78]];
  var tint = new Float32Array(COUNT * 3);
  for (var q = 0; q < COUNT; q++) {
    var g = grp[q] | 0; if (g < 0) g = 0; if (g > 4) g = 4;
    var tc = TC[g];
    var xq = out[q*3], yq = out[q*3+1];
    var vert = 0.62 + 0.38 * clamp((yq - botY) / (hh + 0.001), 0, 1);
    var litl = 0.74 + 0.26 * clamp(0.5 - 0.5 * (xq / (R + 0.001)), 0, 1);
    var rim = 1 - 0.12 * clamp(Math.abs(xq) / (R + 0.001), 0, 1);
    var k2 = vert * litl * rim;
    tint[q*3] = tc[0] * k2; tint[q*3+1] = tc[1] * k2; tint[q*3+2] = tc[2] * k2;
  }
  return { pos: out, grp: grp, tint: tint, R: R, cy: cy, hh: hh, top: topY, bot: botY,
    cand: [[cxx, czz]], candTop: topY + 0.020 + candH, nFlameEnd: nBody + nTop };
}

function scatterPts(scale) {
  var out = new Float32Array(COUNT * 3);
  for (var i = 0; i < COUNT; i++) {
    out[i*3] = rnd(-1, 1) * (scale || 1.25);
    out[i*3+1] = rnd(-1, 1) * (scale || 1.25);
    out[i*3+2] = rnd(-0.5, 0.5);
  }
  return out;
}
function upload(which, arr) {
  gl.bindBuffer(gl.ARRAY_BUFFER, which === 'A' ? bufA : bufB);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr);
}
</script>
<script>
'use strict';
var FW = document.createElement('canvas');
FW.id = 'fw';
FW.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none';
document.body.insertBefore(FW, STAGE3);
var FX = FW.getContext('2d');
var STARS = [], METEORS = [], SHELLS = [], SPARKS = [];
function buildStars() {
  STARS = [];
  var n = NARROW ? 110 : 190;
  for (var i = 0; i < n; i++) {
    STARS.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(0.4, 1.5),
      p: Math.random() * 6.28, s: rnd(0.6, 2.2), a: rnd(0.25, 0.85) });
  }
}
function meteor() {
  var fromLeft = Math.random() < 0.5;
  METEORS.push({ x: fromLeft ? rnd(-0.2, 0.5) * W : rnd(0.5, 1.2) * W, y: rnd(-0.15, 0.35) * H,
    vx: (fromLeft ? 1 : -1) * rnd(0.55, 1.15) * W, vy: rnd(0.28, 0.62) * H, life: 1, len: rnd(0.10, 0.26) });
}
function firework(x, y, hue, power) {
  SHELLS.push({ x: x, y: y, t: 0, hue: hue || 200, power: power || 1 });
}
function burst(x, y, hue, power) {
  var n = Math.round((NARROW ? 52 : 86) * power);
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = rnd(0.15, 0.62) * power * Math.min(W, H);
    SPARKS.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, decay: rnd(0.5, 0.85), hue: hue + rnd(-26, 26), sz: rnd(1.0, 2.6) });
  }
}
function drawFW(dt) {
  FX.clearRect(0, 0, W, H);
  // stars
  for (var i = 0; i < STARS.length; i++) {
    var s = STARS[i];
    s.p += dt * s.s;
    var a = s.a * (0.55 + 0.45 * Math.sin(s.p));
    FX.beginPath();
    FX.arc(s.x, s.y, s.r, 0, 6.2832);
    FX.fillStyle = 'rgba(200,220,255,' + a.toFixed(3) + ')';
    FX.fill();
  }
  // meteors
  for (var m = METEORS.length - 1; m >= 0; m--) {
    var mm = METEORS[m];
    mm.x += mm.vx * dt; mm.y += mm.vy * dt; mm.life -= dt * 0.55;

var SLITS = [];

function swingKnife(done) {

function openPieces() {

    var r = SOLID.getBoundingClientRect();

        });
        setTimeout(function () { e.remove(); }, 1600);
      })(el, (i % 2 ? 1 : -1) * (r.width * 0.44 + 54), (i > 1 ? 1 : -1) * (r.height * 0.36 + 46), (i % 2 ? 1 : -1) * (i > 1 ? 8 : -8));

<script>
'use strict';
var CARD = { on: false, mode: 'ring', rot: 0, rotT: 0, wall: null, items: [], hot: -1, cool: 0, spread: 0 };
var CARDS_N = 8;

function ringPts() {
  var out = new Float32Array(COUNT * 3);
  for (var i = 0; i < COUNT; i++) {
    var a = Math.random() * Math.PI * 2;
    var r = 0.72 + Math.random() * 0.30;
    out[i*3] = Math.cos(a) * r * 1.15;
    out[i*3+1] = Math.sin(a) * r * 0.62;
    out[i*3+2] = rnd(-0.12, 0.12);
  }
  return out;
}

function cylinderPts() {
  var out = new Float32Array(COUNT * 3);
  var rad = NARROW ? 0.98 : 1.42;
  for (var i = 0; i < COUNT; i++) {
    var a = Math.random() * Math.PI * 2;
    var rr = rad * (0.84 + Math.random() * 0.24);
    var yy = rnd(-0.66, 0.66);
    out[i * 3] = Math.cos(a) * rr;
    out[i * 3 + 1] = yy * (0.62 + 0.38 * Math.abs(Math.cos(a)));
    out[i * 3 + 2] = Math.sin(a) * rr * 0.72;
  }
  return out;
}

function cardHTML(i) {
  var n = i + 1;
  return '<div class="ph">照片 ' + n + '</div>' +
    '<img src="photos/' + n + '.jpg" alt="" onerror="this.remove()">';
}

function buildWall() {
  if (CARD.wall) return;
  var wall = document.createElement('div');
  wall.style.cssText = 'position:absolute;left:50%;top:50%;width:0;height:0;' +
    'perspective:1600px;transform-style:preserve-3d';
  STAGE3.appendChild(wall);
  CARD.wall = wall;
  for (var i = 0; i < CARDS_N; i++) {
    var d = document.createElement('div');
    d.className = 'card3';
    d.style.width = NARROW ? '132px' : '300px'; d.style.height = NARROW ? '94px' : '214px';
    d.style.opacity = '0';
    d.style.left = (NARROW ? -66 : -150) + 'px'; d.style.top = (NARROW ? -47 : -107) + 'px';
    d.innerHTML = cardHTML(i);
    wall.appendChild(d);
    CARD.items.push({ el: d, i: i });
  }
}

function startWall() {
  buildWall();
  CARD.on = true;
  CARD.vel = 0; CARD.hasX = false; CARD.hot = -1; CARD.lastX = 0;
  CARD.anim = true; CARD.w = 0; CARD.vS = 0; CARD.vT = 0;
  document.body.classList.add('skyon');
  T.stage = 'wall';
  setTarget(ringPts(), 1.8);
  P.size = 0.86; P.bright = 0.52;
  hint('<span class="chip">手掌左右划，照片墙跟着转</span>');
  for (var i = 0; i < CARD.items.length; i++) {
    var el0 = CARD.items[i].el;
    el0.style.transition = 'none';
    el0.style.transform = 'translate3d(0,0,-380px) scale(.22) rotateY(52deg)';
    el0.style.opacity = '0';
  }
  requestAnimationFrame(function () {
    for (var j = 0; j < CARD.items.length; j++) {
      CARD.items[j].el.style.transition = 'transform 1.05s cubic-bezier(.18,.78,.24,1) ' +
        (70 * j) + 'ms, opacity .8s linear ' + (40 + 70 * j) + 'ms';
    }
    layout(0);
    setTimeout(function () {
      for (var qq = 0; qq < CARD.items.length; qq++) CARD.items[qq].el.style.transition = 'none';
      CARD.anim = false;
    }, 1700);
  });
  window.__mb.expandGrid = expandGrid;
}

function layout(rot) {
  var r = NARROW ? 160 : 520;
  for (var i = 0; i < CARD.items.length; i++) {
    var it = CARD.items[i];
    if (CARD.mode === 'ring') {
      var a = i / CARDS_N * 360 + rot;
      var rad = a * Math.PI / 180;
      var ang = ((a % 360) + 540) % 360 - 180;
      var z = Math.cos(rad) * r;
      var x = Math.sin(rad) * r * (NARROW ? 0.98 : 1.05);
      var sc = 0.62 + 0.28 * ((z + r) / (2 * r));
      var diss = Math.abs(ang) > 82;
      it.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + (Math.sin(rad * 2) * 22).toFixed(1) +
        'px,' + z.toFixed(1) + 'px) rotateY(' + (-ang * 0.42).toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
      it.el.style.opacity = diss ? '0' : (0.52 + 0.48 * ((z + r) / (2 * r))).toFixed(3);
      it.el.style.zIndex = String(100 + Math.round(diss ? -999 : z));
    } else {
      var cols = NARROW ? 2 : 4;
      var rows = CARDS_N / cols;
      var col = i % cols, row = (i / cols) | 0;
      var gx = (col - (cols - 1) / 2) * (NARROW ? 152 : 352);
      var gy = (row - (rows - 1) / 2) * (NARROW ? 112 : 246);
      var tilt = NARROW ? 0 : (col - 1.5) * -7;
      it.el.style.transform = 'translate3d(' + gx.toFixed(1) + 'px,' + gy.toFixed(1) + 'px,0) ' +
        'rotateY(' + tilt + 'deg) scale(' + (NARROW ? 0.86 : 0.96) + ')';
      it.el.style.opacity = '1';
      it.el.style.zIndex = '200';
    }
  }
}

function expandGrid() {
  if (CARD.mode === 'grid') return;
  CARD.mode = 'grid';
  T.stage = 'grid';
  layout(0);
  boom(0.8);
  hint('<span class="chip">双手握拳 · 回到 3D 照片墙</span>');
}

function openCard(i) {
  var m = document.getElementById('cardModal');
  var img = m.querySelector('img');
  var cap = m.querySelector('.cap');
  var it = CARD.items[i];
  var ph = it.el.querySelector('.ph');
  if (it.el.querySelector('img')) img.src = it.el.querySelector('img').src;
  else img.removeAttribute('src');
  cap.textContent = ph ? ph.textContent : ('照片 ' + (i + 1));
  m.classList.add('on');
  firework(W * 0.5, H * 0.4, 40, 1.2);
}
document.querySelector('#cardModal .x').addEventListener('click', function () {
  document.getElementById('cardModal').classList.remove('on');
});

function pickCard(px, py) {
  var best = -1, bd = 1e9;
  for (var i = 0; i < CARD.items.length; i++) {
    var r = CARD.items[i].el.getBoundingClientRect();
    if (r.width < 4) continue;
    var dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height / 2);
    var d = Math.hypot(dx, dy);
    if (d < Math.max(r.width, r.height) * 0.62 && d < bd) { bd = d; best = i; }
  }
  return best;
}

function onHandWall(h, dt) {
  if (CARD.cool > 0) CARD.cool -= dt * 1000;
  if (!CARD.on) return;
  // 双手张开 → 展开网格
  if (HK.hands.length >= 2) {
    var a = HK.hands[0], b = HK.hands[1];
    var dist = Math.hypot(a.palm.x - b.palm.x, a.palm.y - b.palm.y);
    if (dist > Math.min(W, H) * 0.30 && CARD.mode === 'ring') { expandGrid(); CARD.cool = 900; }
  }
  if (!h) { CARD.hasX = false; CARD.hot = -1; return; }
  // 只用手掌横向位移驱动「公转」，不做任何拾取/点击
  var px = h.palm.x;
  if (CARD.hasX) {
    var vx = px - CARD.lastX;
    if (Math.abs(vx) < 1.6) vx = 0;
    CARD.vel = CARD.vel * 0.60 + vx * 1.20;
    CARD.rotT -= vx * 1.05;
  }
  CARD.lastX = px;
  CARD.hasX = true;
}

// 每帧平滑推进旋转（与手是否有数据无关；丢手后按惯性滑行）
function tickWall(dt) {
  if (!CARD.on || CARD.mode !== 'ring') return;
  if (!CARD.hasX) {
    CARD.rotT -= CARD.vel * 0.55;
    CARD.vel *= Math.pow(0.34, dt * 3.0);
    if (Math.abs(CARD.vel) < 0.02) CARD.vel = 0;
  }
  CARD.rot += (CARD.rotT - CARD.rot) * (1 - Math.exp(-10.5 * dt));
  layout(CARD.rot);
}

// 鼠标/触屏兜底（没有摄像头或调试用）
var DRAG = null;
addEventListener('pointerdown', function (e) {
  if (!CARD.on) return;
  DRAG = { x: e.clientX, t: Date.now() };
});
addEventListener('pointermove', function (e) {
  if (!CARD.on || !DRAG) return;
  if (CARD.mode === 'ring') { CARD.rotT -= (e.clientX - DRAG.x) * 0.9; DRAG.x = e.clientX; }
});
addEventListener('pointerup', function (e) {
  if (!CARD.on) { DRAG = null; return; }
  var moved = DRAG ? Math.abs(e.clientX - DRAG.x) : 0;
  DRAG = null;
  if (moved < 8) {
    var i = pickCard(e.clientX, e.clientY);
    if (i >= 0) openCard(i);
  }
});
</script>
<script>
"use strict";
// ── 照片墙外圈：粒子光环（独立 program；暖金色，与蓝紫星场区分） ──
var RING = { rot: 0, spd: 8.5, on: 0, n: NARROW ? 3200 : 6400, prog: null, buf: null, u: {}, loc: -1, ready: false };
var RVS = [
"attribute vec3 aR;",
"uniform float uRot, uRp, uBand, uTilt, uHalfW, uHalfH, uPP, uTime, uDpr, uSize, uOn;",
"varying vec3 vCol;",
"varying float vA;",
"void main(){",
"  float a = aR.x * 6.2831853 + uRot;",
"  float band = aR.y - 0.5;",
"  float rr = uRp * (1.0 + band * 0.06);",
"  float px = sin(a) * rr * 1.25;",
"  float pz = cos(a) * rr;",
"  float py = -cos(a) * uRp * uTilt + band * uBand * 2.0 + sin(a * 2.0 + uTime * 0.55 + aR.y * 7.0) * uBand * 0.45;",
"  float persp = uPP / (uPP - pz);",
"  vec2 q = vec2(px * persp / uHalfW, py * persp / uHalfH);",
"  gl_Position = vec4(q, 0.0, 1.0);",
"  gl_PointSize = clamp(uSize * uDpr * (0.55 + aR.y * 0.95) * persp, 0.9, 16.0 * uDpr);",
"  float tw = 0.55 + 0.45 * sin(uTime * (1.1 + aR.y * 2.0) + aR.x * 47.0);",
"  vec3 gold = vec3(1.00, 0.82, 0.48);",
"  vec3 warm = vec3(1.00, 0.66, 0.38);",
"  vec3 c = mix(gold, warm, aR.y);",
"  float depth = 0.55 + 0.45 * clamp(pz / uRp * 0.5 + 0.5, 0.0, 1.0);",
"  vCol = c * uOn * (0.85 + 0.35 * tw) * depth;",
"  vA = (0.32 + 0.34 * aR.z) * uOn * tw;",
"}"
].join("\n");

function initRing() {
  if (RING.ready) return;
  var pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, RVS));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error("ring link: " + gl.getProgramInfoLog(pr));
  RING.prog = pr;
  var n = RING.n, arr = new Float32Array(n * 3);
  for (var i = 0; i < n; i++) { arr[i*3] = Math.random(); arr[i*3+1] = Math.random(); arr[i*3+2] = Math.random(); }
  RING.buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, RING.buf);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
  RING.loc = gl.getAttribLocation(pr, "aR");
  ["uRot","uRp","uBand","uTilt","uHalfW","uHalfH","uPP","uTime","uDpr","uSize","uOn"].forEach(function (k) {
    RING.u[k] = gl.getUniformLocation(pr, k);
  });
  RING.ready = true;
}

// WebGL1 没有 VAO：画完光环必须把主程序的属性指针重新绑回来
function rebindMain() {
  var p = [["aA", bufA, 3], ["aB", bufB, 3], ["aSeed", bufSeed, 3], ["aTint", bufTint, 3]];
  for (var i = 0; i < p.length; i++) {
    var l = gl.getAttribLocation(PROG, p[i][0]);
    if (l < 0) continue;
    gl.bindBuffer(gl.ARRAY_BUFFER, p[i][1]);
    gl.enableVertexAttribArray(l);
    gl.vertexAttribPointer(l, p[i][2], gl.FLOAT, false, 0, 0);
  }
}

function drawRing(rdt) {
  if (CARD.cool > 0) CARD.cool -= rdt * 1000; if (CARD.cool < 0) CARD.cool = 0;
  wgTick();
  var want = (CARD.on && CARD.mode === "ring") ? 1 : 0;
  RING.on += (want - RING.on) * (1 - Math.exp(-2.6 * rdt));
  if (RING.on < 0.004) return;
  if (!RING.ready) initRing();
  RING.rot += RING.spd * 0.0174532925 * rdt;
  var u = RING.u;
  gl.useProgram(RING.prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, RING.buf);
  gl.enableVertexAttribArray(RING.loc);
  gl.vertexAttribPointer(RING.loc, 3, gl.FLOAT, false, 0, 0);
  gl.uniform1f(u.uHalfW, W * 0.5);
  gl.uniform1f(u.uHalfH, H * 0.5);
  gl.uniform1f(u.uPP, 1600);
  gl.uniform1f(u.uTime, P.time);
  gl.uniform1f(u.uDpr, DPR);
  for (var pass = 0; pass < 2; pass++) {
    gl.uniform1f(u.uRot, RING.rot * (pass ? 0.86 : 1) + (pass ? 0.9 : 0));
    gl.uniform1f(u.uRp, (NARROW ? 160 : 520) * (pass ? 1.16 : 1));
    gl.uniform1f(u.uBand, (NARROW ? 22 : 30) * (pass ? 1.4 : 1));
    gl.uniform1f(u.uTilt, (NARROW ? 0.60 : 0.45) * (pass ? 1.12 : 1));
    gl.uniform1f(u.uSize, (NARROW ? 2.2 : 2.9) * (pass ? 0.82 : 1));
    gl.uniform1f(u.uOn, RING.on * (pass ? 0.5 : 1));
    gl.drawArrays(gl.POINTS, 0, RING.n);
  }
  rebindMain();
}

// ── 手掌横划 → 角速度飞轮（惯性 + 阻尼，绕固定竖轴公转） ──
CARD.anim = false; CARD.w = 0; CARD.vS = 0; CARD.vT = 0;

function collapseRing() {
  if (CARD.mode !== 'grid') return;
  CARD.mode = 'ring';
  T.stage = 'wall';
  CARD.w = 0; CARD.vS = 0; CARD.vT = 0; CARD.hasX = false;
  layout(CARD.rot);
  boom(0.5);
  hint('<span class="chip">手掌左右划，照片墙跟着转</span>');
}
window.__mb = window.__mb || {}; window.__mb.collapseRing = collapseRing;

function onHandWall(h, dt) {
  if (!CARD.on) return;
  var fists = 0;
  for (var fi = 0; fi < HK.hands.length; fi++) if (HK.hands[fi].fist) fists++;
  // 双手握拳 → 从网格折回 3D 环形（握拳期间不触发向外扩散，避免来回跳）
  if (CARD.mode === 'grid' && fists >= 2 && CARD.cool <= 0) { collapseRing(); CARD.cool = 1200; return; }
  if (HK.hands.length >= 2 && fists === 0) {
    var a0 = HK.hands[0], b0 = HK.hands[1];
    var dist = Math.hypot(a0.palm.x - b0.palm.x, a0.palm.y - b0.palm.y);
    if (dist > Math.min(W, H) * 0.30 && CARD.mode === "ring" && CARD.cool <= 0) { expandGrid(); CARD.cool = 1200; }
  }
  if (!h) { CARD.hasX = false; CARD.hot = -1; return; }
  var px = h.palm.x;
  if (CARD.hasX && dt > 0.0008) {
    var v = (px - CARD.lastX) / dt;
    if (Math.abs(v) < 70) v = 0; else v -= (v > 0 ? 70 : -70);
    CARD.vS += (v - CARD.vS) * (1 - Math.exp(-15 * dt));
    CARD.vT = performance.now();
  }
  CARD.lastX = px;
  CARD.hasX = true;
}

function tickWall(dt) {
  if (!CARD.on || CARD.mode !== "ring" || CARD.anim) return;
  var fresh = (performance.now() - (CARD.vT || 0)) < 150;
  var target = fresh ? -CARD.vS * 0.30 : 0;
  var k = fresh ? 9.0 : 1.9;
  CARD.w += (target - CARD.w) * (1 - Math.exp(-k * dt));
  if (Math.abs(CARD.w) < 0.06) CARD.w = 0;
  if (CARD.w > 340) CARD.w = 340; else if (CARD.w < -340) CARD.w = -340;
  if (CARD.w !== 0) { CARD.rot += CARD.w * dt; layout(CARD.rot); }
}

// 鼠标/触屏拖动也走同一套速度模型（DRAG 由 c9 的 pointerdown 维护）
var MOUSEV = { x: 0, t: 0 };
addEventListener("pointerdown", function (e) { MOUSEV.x = e.clientX; MOUSEV.t = performance.now(); });
addEventListener("pointermove", function (e) {
  if (!CARD.on || !DRAG || CARD.mode !== "ring") return;
  var now = performance.now();
  var dtm = (now - MOUSEV.t) / 1000;
  if (dtm < 0.001) dtm = 0.001;
  var v = (e.clientX - MOUSEV.x) / dtm;
  MOUSEV.x = e.clientX; MOUSEV.t = now;
  if (Math.abs(v) < 70) v = 0; else v -= (v > 0 ? 70 : -70);
  CARD.vS += (v - CARD.vS) * 0.45;
  CARD.vT = now;
});

// ── 照片墙分步引导（用户不知道下一步做什么 → 明确 1/2/3 步） ──
var WG = null, WGmode = '', WGt = 0, WGdim = true;
function wgEl() {
  if (WG) return WG;
  WG = document.createElement('div');
  WG.id = 'wguide';
  WG.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);' +
    'bottom:calc(44px + env(safe-area-inset-bottom));z-index:6;display:flex;flex-direction:column;' +
    'gap:6px;align-items:center;pointer-events:none;opacity:0;transition:opacity .5s';
  document.body.appendChild(WG);
  return WG;
}
function wgRow(n, txt, hot) {
  return '<div style="display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:' + (NARROW ? 11.5 : 13) + 'px;' +
    'letter-spacing:.03em;color:' + (hot ? '#ffe2a8' : '#c2d6f6') + ';text-shadow:0 2px 10px rgba(0,0,0,.85)">' +
    '<span style="flex:0 0 auto;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:50%;' +
    'font-size:10px;border:1px solid ' + (hot ? 'rgba(255,214,140,.8)' : 'rgba(150,190,255,.45)') + ';' +
    'background:rgba(12,18,34,.6);color:' + (hot ? '#ffd88a' : '#a8c2ea') + '">' + n + '</span>' +
    '<span>' + txt + '</span></div>';
}
function wgShow(mode) {
  var e = wgEl();
  var box = '<div style="padding:9px 15px;border-radius:14px;border:1px solid rgba(150,190,255,.22);' +
    'background:rgba(10,16,30,.5);backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:6px">';
  if (mode === 'grid') {
    e.innerHTML = box +
      wgRow('✦', '<b>双手同时握拳</b> → 回到 3D 环绕', true) +
      wgRow('✦', '<b>点一张照片</b> → 放大查看', false) + '</div>';
  } else {
    e.innerHTML = box +
      wgRow('1', '<b>手掌左右划</b> → 照片墙跟着转', true) +
      wgRow('2', '<b>双手向两边分开</b> → 展开全部照片', false) +
      wgRow('3', '<b>点一张照片</b> → 放大查看', false) + '</div>';
  }
  e.style.opacity = '1';
  WGt = performance.now(); WGdim = false;
  if (typeof hint === 'function') hint('');
}
function wgTick() {
  if (!WG) { if (!CARD.on) return; wgShow(CARD.mode); return; }
  if (!CARD.on) { if (WG.style.opacity !== '0') WG.style.opacity = '0'; WGmode = ''; return; }
  if (WGmode !== CARD.mode) { WGmode = CARD.mode; wgShow(CARD.mode); return; }
  if (!WGdim && performance.now() - WGt > 9000) { WG.style.opacity = '.45'; WGdim = true; }
}

window.__mb = window.__mb || {};
window.__mb.collapseRing = collapseRing;
window.__mb.expandGrid = expandGrid;
window.__mb.wgShow = wgShow;
setTimeout(function () {
  window.__mb = window.__mb || {};
  window.__mb.collapseRing = collapseRing;
  window.__mb.expandGrid = expandGrid;
  window.__mb.wgShow = wgShow;
  window.__mb.wgTick = wgTick;
}, 0);
</script>

/* ========== 二、宇宙：粒子星空 ========== */
var cv = document.getElementById('space');
var ctx = cv.getContext('2d');
var W=0, H=0, DPR=1, MOBILE=false;
var stars=[], dusts=[], nebs=[], nebImg=[];
var t=0, last=0, mx=0, my=0, tmx=0, tmy=0;
var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function sprite(r,g,b){
  var c=document.createElement('canvas'); c.width=c.height=256;
  var g2=c.getContext('2d');
  var gr=g2.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba('+r+','+g+','+b+',.55)');
  gr.addColorStop(.36,'rgba('+r+','+g+','+b+',.18)');
  gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
  g2.fillStyle=gr; g2.fillRect(0,0,256,256);
  return c;
}

function buildStars(){
  var n=Math.round(Math.min(calm?420:900, Math.max(230,(W*H)/6200)));
  stars=[];
  for(var i=0;i<n;i++){
    var d=Math.random();
    stars.push({ x:Math.random()*W, y:Math.random()*H,
      r:0.45+d*1.7, a:0.16+0.52*d, d:0.25+d*0.95,
      tw:0.5+Math.random()*1.9, ph:Math.random()*6.283,
      vx:-(1.2+d*5.5)*(calm?0.3:1),
      col:(Math.random()<0.84?'196,220,255':'255,214,168') });
  }
}

function buildDust(){
  var n=Math.round(Math.min(140, Math.max(38,(W*H)/27000)));
  dusts=[];
  for(var i=0;i<n;i++){
    dusts.push({ x:Math.random()*W, y:Math.random()*H, sz:7+Math.random()*22,
      a:0.05+Math.random()*0.12, d:0.3+Math.random()*0.8,
      vx:-(0.8+Math.random()*2.2), vy:-(0.3+Math.random()*1.1) });
  }
}

function buildNeb(){
  nebImg=[ sprite(58,116,255), sprite(120,86,255), sprite(255,120,70), sprite(56,214,200) ];
  nebs=[];
  var conf=[[0,.18,1.15,1],[0.78,.12,0.95,2],[0.12,.82,0.85,3],[0.86,.78,0.75,0],[0.5,.52,0.7,1]];
  for(var i=0;i<conf.length;i++){
    var c=conf[i];
    nebs.push({ x:c[0], y:c[1], size:c[2]*Math.max(W,H), img:nebImg[c[3]],
      a:MOBILE?0.16:0.20, d:0.2+i*0.16,
      vx:(i%2?1:-1)*(0.004+Math.random()*0.004), vy:(Math.random()<0.5?1:-1)*(0.003+Math.random()*0.003) });
  }
}

var comet=null, cometNext=3.5;
function spawnComet(){
  var fromLeft=Math.random()<0.6;
  comet={ x: fromLeft? -40 : W+40, y: Math.random()*H*0.55,
    vx:(fromLeft?1:-1)*(320+Math.random()*220), vy:(90+Math.random()*120),
    life:1.5 };
}

function drawUniverse(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  /* 星云 */
  for(var i=0;i<nebs.length;i++){
    var n=nebs[i];
    n.x+=n.vx*dt; n.y+=n.vy*dt;
    if(n.x>1.3) n.x=-0.3; if(n.x<-0.3) n.x=1.3;
    if(n.y>1.3) n.y=-0.3; if(n.y<-0.3) n.y=1.3;
    var nx=n.x*W - n.size*0.5 + mx*22*n.d;
    var ny=n.y*H - n.size*0.5 + my*18*n.d;
    ctx.globalAlpha=n.a;
    ctx.drawImage(n.img,nx,ny,n.size,n.size);
  }
  ctx.globalAlpha=1;

  /* 尘埃 */
  for(i=0;i<dusts.length;i++){
    var u=dusts[i];
    u.x+=u.vx*dt; u.y+=u.vy*dt;
    if(u.x<-30) u.x=W+30;
    if(u.y<-30) u.y=H+30;
    var ux=u.x+mx*16*u.d, uy=u.y+my*13*u.d;
    if(ux<-30) ux=W+30;
    ctx.globalAlpha=u.a;
    ctx.drawImage(nebImg[(i%4)], ux-u.sz*0.5, uy-u.sz*0.5, u.sz, u.sz);
  }
  ctx.globalAlpha=1;

  /* 星点 */
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    s.x+=s.vx*dt;
    if(s.x<-6) { s.x=W+6; s.y=Math.random()*H; }
    var al=s.a*(0.52+0.48*Math.sin(t*s.tw+s.ph));
    if(al<=0.03) continue;
    var sx=s.x+mx*11*s.d+Math.sin(t*0.14+s.ph)*1.1;
    var sy=s.y+my*9*s.d;
    ctx.fillStyle='rgba('+s.col+','+al.toFixed(3)+')';
    ctx.beginPath();
    ctx.arc(sx,sy,s.r,0,6.2832); ctx.fill();
  }

  /* 流星 */
  cometNext-=dt;
  if(!comet && cometNext<=0){ spawnComet(); cometNext=5+Math.random()*7; }
  if(comet){
    comet.x+=comet.vx*dt; comet.y+=comet.vy*dt; comet.life-=dt;
    var tailX=comet.x-comet.vx*0.09, tailY=comet.y-comet.vy*0.09;
    var grd=ctx.createLinearGradient(comet.x,comet.y,tailX,tailY);
    grd.addColorStop(0,'rgba(230,244,255,.95)');
    grd.addColorStop(1,'rgba(160,200,255,0)');
    ctx.strokeStyle=grd; ctx.lineWidth=1.7; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(comet.x,comet.y); ctx.lineTo(tailX,tailY); ctx.stroke();
    ctx.fillStyle='rgba(240,250,255,.95)';
    ctx.beginPath(); ctx.arc(comet.x,comet.y,1.7,0,6.2832); ctx.fill();
    if(comet.life<=0 || comet.x<-120 || comet.x>W+120 || comet.y>H+120) comet=null;
  }
  ctx.globalCompositeOperation='source-over';
}
/* ========== 三、星球：建出来、绕起来、点开 ========== */
var stage   = document.getElementById('stage');
var feedEl  = document.getElementById('feed');
var pnameEl = document.getElementById('pname');
var pdotEl  = document.getElementById('pdot');
var pfootEl = document.getElementById('pfoot');
var tipEl   = document.getElementById('tip');

var PL = [], sel = null, chatSeq = 0;

function hexA(hex, a){
  var h = hex.replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')';
}

function addPlanet(d){
  var i = PL.length;
  var el = document.createElement('div');
  el.className = 'p';
  el.tabIndex = 0;
  el.setAttribute('role','button');
  el.setAttribute('aria-label', d.name);
  el.style.setProperty('--c1', d.c1);
  el.style.setProperty('--c2', d.c2);
  el.style.setProperty('--ring', d.ring);
  el.style.setProperty('--glow', hexA(d.c1, 0.34));
  el.style.setProperty('--glow2', hexA(d.c1, 0.15));

  var D = (MOBILE? 46 : 62) * d.k;
  var ho = document.createElement('div');
  ho.className = 'p-holder';
  ho.style.width = ho.style.height = D.toFixed(1)+'px';
  ho.style.left = (-D/2).toFixed(1)+'px';
  ho.style.top  = (-D/2).toFixed(1)+'px';

  var halo = document.createElement('div'); halo.className='p-halo';
  var HS = D*2.5; halo.style.width = halo.style.height = HS.toFixed(1)+'px';
  var orb = document.createElement('div'); orb.className='p-orb';
  var rng = document.createElement('div'); rng.className='p-ring';
  var RS = D*1.62; rng.style.width = rng.style.height = RS.toFixed(1)+'px';
  ho.appendChild(halo); ho.appendChild(orb); ho.appendChild(rng);

  var lb = document.createElement('div'); lb.className='p-label';
  lb.textContent = MOBILE? d.name.split(' \u00b7 ')[0] : d.name;
  lb.style.left = '0';
  lb.style.top = (D*0.60).toFixed(1)+'px';
  lb.style.transform = 'translateX(-50%)';
  lb.style.textAlign = 'center';
  lb.style.whiteSpace = 'normal';
  lb.style.width='max-content'; lb.style.maxWidth=(MOBILE? 128 : 186)+'px';
  lb.style.lineHeight = '1.35';
  var bd = document.createElement('div'); bd.className='p-badge';
  bd.textContent = d.badge;
  bd.style.left = '0';
  bd.style.top = (D*0.60 + 22).toFixed(1)+'px';
  bd.style.transform='translateX(-50%)'; bd.style.whiteSpace='nowrap'; bd.style.width='max-content';
  if(MOBILE) bd.style.display = 'none';
el.appendChild(ho); el.appendChild(lb); el.appendChild(bd);
  stage.appendChild(el);

  var g = { d:d, el:el, ho:ho, lb:lb, bd:bd, D:D, idx:i,
    a: (i * 6.2832 / (DATA.length + 1)) + 0.35, spd: (0.020 + (i%3)*0.011) * (i%2? 1 : -1),
    ph: Math.random()*6.283, x:W*0.5, y:H*0.5, k:1, al:0 };
  g.x = W*0.5 + Math.cos(g.a)*130;
  g.y = H*0.5 + Math.sin(g.a)*95;

  el.addEventListener('click', function(e){ e.stopPropagation(); select(g); });
  el.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); select(g); }
  });
  el.addEventListener('pointerenter', function(){ el.classList.add('hot'); });
  el.addEventListener('pointerleave', function(){ el.classList.remove('hot'); });

  PL.push(g);
  return g;
}

/* 每帧算位置：没选中绕中心慢慢转，选中后被拉到左边放大 */
function layout(dt){
  var cx = W*0.5, cy = H*0.5;
  var spanX = Math.max(110, W*0.5 - 52);
  var spanY = Math.max(100, H*0.5 - 52);
  var RATP = [0.58, 0.88, 0.66, 0.96, 0.74, 0.46, 0.82, 0.62, 0.52];
  var i, g, d, tx, ty, tk, ta;
  var TX = [], TY = [];

  for(i=0;i<PL.length;i++){
    g = PL[i]; d = g.d;
    if(sel === g){
      var freeW = MOBILE? W : Math.max(300, W - 404);
      TX[i] = MOBILE? W*0.5 : freeW*0.5;
      TY[i] = MOBILE? H*0.19 : H*0.50;
    } else {
      var rr = RATP[g.idx % RATP.length] * (1 + 0.035*Math.sin(t*0.29 + g.ph));
      var aa = g.a + t*0.026;
      TX[i] = cx + Math.cos(aa)*spanX*rr + Math.sin(t*0.5+g.ph)*5;
      TY[i] = cy + Math.sin(aa)*spanY*rr*(MOBILE?0.96:0.82) + Math.cos(t*0.42+g.ph)*6;
    }
  }

  for(i=0;i<PL.length;i++){
    if(PL[i] === sel) continue;
    for(var j=i+1;j<PL.length;j++){
      if(PL[j] === sel) continue;
      var dx = TX[j]-TX[i], dy = TY[j]-TY[i];
      var dist = Math.sqrt(dx*dx+dy*dy) || 1;
      var need = (PL[i].D + PL[j].D)*0.62 + 34;
      if(dist < need){
        var push = (need-dist)*0.5;
        var ux = dx/dist, uy = dy/dist;
        TX[i] -= ux*push; TY[i] -= uy*push;
        TX[j] += ux*push; TY[j] += uy*push;
      }
    }
  }

  for(i=0;i<PL.length;i++){
    g = PL[i];
    if(sel === g){ tk = MOBILE? 1.5 : 2.05; ta = 1; }
    else { tk = 1; ta = sel? (MOBILE? 0 : 0.13) : 1; }
    var e = 1 - Math.exp(-dt*(sel===g? 6.5 : 3.2));
    g.x += (TX[i]-g.x)*e;
    g.y += (TY[i]-g.y)*e;
    g.k += (tk-g.k)*e;
    g.al += (ta-g.al)*e;
    if(g.al < 0.02){ g.el.style.display = 'none'; continue; }
    g.el.style.display = '';
    g.el.style.transform = 'translate3d('+g.x.toFixed(1)+'px,'+g.y.toFixed(1)+'px,0)';
    g.el.style.opacity = g.al.toFixed(3);
    g.ho.style.transform = 'scale('+g.k.toFixed(3)+')';
    g.el.style.pointerEvents = (sel && sel !== g)? 'none' : 'auto';
    g.lb.style.opacity = (sel===g)? 0 : Math.min(1, g.al*1.35).toFixed(2);
    g.bd.style.opacity = (sel===g)? 0 : Math.min(1, g.al*1.15).toFixed(2);
  }
}

/* ========== 四、右侧聊天面板 ========== */
function scrollFeed(){ feedEl.scrollTop = feedEl.scrollHeight; }

function pushMsg(html, cls, seq, cb){
  if(seq !== chatSeq) return;
  var m = document.createElement('div');
  m.className = 'msg' + (cls? ' '+cls : '');
  m.innerHTML = html;
  feedEl.appendChild(m);
  void m.offsetWidth;
  m.classList.add('in');
  scrollFeed();
  if(cb) cb();
}

function renderChat(g){
  var d = g.d;
  chatSeq++;
  var seq = chatSeq;
  feedEl.innerHTML = '';
  pnameEl.textContent = d.name;
  pdotEl.style.background = d.c1;
  pdotEl.style.color = d.c1;
  pfootEl.className = 'p-foot';
  pfootEl.innerHTML = '';

  var i = 0;
  function step(){
    if(seq !== chatSeq) return;
    if(i >= d.msgs.length){ finish(); return; }
    var ty = document.createElement('div');
    ty.className = 'msg typing';
    ty.innerHTML = '<i></i><i></i><i></i>';
    feedEl.appendChild(ty);
    scrollFeed();
    setTimeout(function(){
      if(seq !== chatSeq) return;
      if(ty.parentNode) ty.parentNode.removeChild(ty);
      pushMsg(d.msgs[i], '', seq);
      i++;
      setTimeout(step, 180);
    }, 430 + Math.random()*230);
  }

  function finish(){
    if(seq !== chatSeq) return;
    var tg = document.createElement('div');
    tg.className = 'msg tags';
    for(var j=0;j<d.tags.length;j++){
      var s = document.createElement('span');
      s.className = 'tag'; s.textContent = d.tags[j];
      tg.appendChild(s);
    }
    feedEl.appendChild(tg);
    void tg.offsetWidth; tg.classList.add('in');

    pfootEl.innerHTML = '';
    if(d.href){
      var a = document.createElement('a');
      a.className = 'go-btn'; a.href = d.href;
      a.textContent = d.cta || '进去看';
      pfootEl.appendChild(a);
    } else {
      var sp = document.createElement('span');
      sp.className = 'soon-btn'; sp.textContent = '还在筹备，先看看别的';
      pfootEl.appendChild(sp);
    }
    var x = document.createElement('button');
    x.className = 'x-btn'; x.type='button';
    x.setAttribute('aria-label','收起');
    x.textContent = '\u00d7';
    x.addEventListener('click', function(ev){ ev.stopPropagation(); clearSel(); });
    pfootEl.appendChild(x);
    pfootEl.classList.add('in');
    scrollFeed();
  }

  step();
}

function select(g){
  if(sel === g) return;
  sel = g;
  document.body.classList.add('sel');
  if(tipEl) tipEl.textContent = '点空白处收起';
  renderChat(g);
}

function clearSel(){
  if(!sel) return;
  sel = null;
  chatSeq++;
  document.body.classList.remove('sel');
  if(tipEl) tipEl.textContent = '点一颗星球，看它是什么';
}
/* ========== 五、私人星球：只有你能唤出来 ========== */
var mineG = null, toastTm = 0;
var toastEl = document.getElementById('toast');

function toast(msg){
  if(!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTm);
  toastTm = setTimeout(function(){ toastEl.classList.remove('on'); }, 2400);
}

function renderMine(openIt){
  if(mineG) return;
  mineG = addPlanet(PRIVATE);
  try{ localStorage.setItem('kc_mine','1'); }catch(e){}
  if(openIt){
    toast('这颗星球只有你能看见');
    setTimeout(function(){ if(mineG) select(mineG); }, 720);
  }
}

/* 1) 键盘连打 mama  2) 长按左上角 Logo 900ms  3) ?mine=1 或 #mine */
var keys = '';
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ clearSel(); return; }
  if(!e.key || e.key.length !== 1) return;
  keys = (keys + e.key.toLowerCase()).slice(-12);
  if(keys.indexOf('mama') >= 0){ keys = ''; renderMine(true); }
});

var brandEl = document.getElementById('brand'), holdTm = 0;
if(brandEl){
  var holdStart = function(){
    holdTm = setTimeout(function(){ renderMine(true); }, 900);
  };
  var holdEnd = function(){ clearTimeout(holdTm); };
  brandEl.addEventListener('pointerdown', holdStart);
  brandEl.addEventListener('pointerup', holdEnd);
  brandEl.addEventListener('pointercancel', holdEnd);
  brandEl.addEventListener('pointerleave', holdEnd);
  brandEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

/* 解锁判定放在初始化之后（见文件末尾），那时 W/H 才量得准 */

/* ========== 六、装到桌面 + 尺寸 + 主循环 ========== */
var installBtn = document.getElementById('installBtn');
var deferredInstall = null;

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstall = e;
  if(installBtn) installBtn.hidden = false;
});

if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches && installBtn){
  installBtn.hidden = true;
}

if(installBtn){
  installBtn.addEventListener('click', function(){
    if(deferredInstall){
      deferredInstall.prompt();
      deferredInstall = null;
      installBtn.hidden = true;
    } else {
      toast('浏览器菜单里选「添加到主屏幕」');
    }
  });
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  MOBILE = window.innerWidth < 820;
  W = cv.clientWidth || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(W*DPR);
  cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildStars();
  buildDust();
  buildNeb();
}

var rt = 0;
window.addEventListener('resize', function(){
  clearTimeout(rt);
  rt = setTimeout(resize, 180);
});

window.addEventListener('pointermove', function(e){
  tmx = (e.clientX/Math.max(1,W) - 0.5) * 2;
  tmy = (e.clientY/Math.max(1,H) - 0.5) * 2;
}, {passive:true});

document.addEventListener('click', function(e){
  var tg = e.target;
  if(tg && tg.closest && (tg.closest('.p') || tg.closest('#panel'))) return;
  clearSel();
});

function frame(ts){
  if(!last) last = ts;
  var dt = Math.min(0.05, (ts - last)/1000);
  last = ts;
  t += dt;
  var k = Math.min(1, dt*2.8);
  mx += (tmx - mx)*k;
  my += (tmy - my)*k;
  drawUniverse(calm? dt*0.35 : dt);
  layout(dt);
  requestAnimationFrame(frame);
}

resize();
for(var n=0; n<DATA.length; n++) addPlanet(DATA[n]);
requestAnimationFrame(frame);

/* 初始化完成后再亮出私人星球 */
try{
  if(localStorage.getItem('kc_mine') === '1') renderMine(false);
}catch(e){}

if(/[?&]mine=1/.test(location.search) || location.hash === '#mine') renderMine(true);

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}
})();

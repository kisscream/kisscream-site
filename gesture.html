<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>手势识别交互 · KissCream</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#05070a; --ink:#eef3f5; --dim:#8b9aa3; --line:rgba(255,255,255,.09);
  --hot:#ff6b35; --hot2:#ffa06a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;
  justify-content:space-between;padding:0 clamp(16px,4vw,40px);z-index:20;
  background:linear-gradient(180deg,rgba(5,7,10,.9),rgba(5,7,10,0));
  backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;
  font-weight:700;font-size:15px;letter-spacing:.01em}
.brand .mark{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(140deg,#ff8a4c,#e2521f);box-shadow:0 2px 10px rgba(255,107,53,.35)}
.brand .mark i{width:9px;height:9px;border-radius:50%;background:#0a0d10;display:block}
.back{font-size:12.5px;color:var(--dim);text-decoration:none;border:1px solid var(--line);
  padding:6px 12px;border-radius:99px;transition:.2s}
.back:hover{color:var(--ink);border-color:rgba(255,255,255,.25)}

/* 左上：状态面板 */
.panel{position:fixed;left:clamp(14px,3vw,28px);top:74px;z-index:15;width:212px;
  background:rgba(10,14,18,.72);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;backdrop-filter:blur(10px);font-size:12px;line-height:1.7}
.panel h4{font-size:10.5px;letter-spacing:.14em;color:var(--dim);font-weight:600;
  text-transform:uppercase;margin-bottom:9px}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.row b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.row.s b{color:var(--hot2)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3a464d;
  margin-right:6px;vertical-align:1px;transition:.25s}
.dot.on{background:#43d17c;box-shadow:0 0 8px rgba(67,209,124,.8)}
.dot.warn{background:#e8b33c;box-shadow:0 0 8px rgba(232,179,60,.7)}
.dot.err{background:#e05656;box-shadow:0 0 8px rgba(224,86,86,.7)}

/* 右上：摄像头预览 */
.cam{position:fixed;right:clamp(14px,3vw,28px);top:74px;z-index:15;width:176px;
  border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:#0a0e12;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.cam video{display:block;width:100%;height:auto;transform:scaleX(-1);opacity:.92;
  filter:saturate(.55) contrast(1.05)}
.cam .cap{position:absolute;left:8px;bottom:6px;font-size:10px;color:#cfe0e8;
  background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px;letter-spacing:.04em}
.cam.off video{display:none}
.cam.off{height:88px;display:grid;place-items:center}
.cam.off .cap{position:static;background:none;color:var(--dim);text-align:center;
  padding:0 10px;line-height:1.5;font-size:11px}

/* 底部提示 */
.hint{position:fixed;left:50%;bottom:clamp(16px,3.6vh,34px);transform:translateX(-50%);
  z-index:15;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  width:min(720px,92vw)}
.chip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#c9d6dd;
  background:rgba(10,14,18,.74);border:1px solid var(--line);border-radius:99px;
  padding:8px 14px;backdrop-filter:blur(10px);white-space:nowrap}
.chip em{font-style:normal;color:var(--hot2);font-weight:600}
.chip k{font:600 11px/1 ui-monospace,Consolas,monospace;border:1px solid var(--line);
  border-radius:5px;padding:3px 5px;color:var(--ink)}

/* 大动作字样（触发时闪现） */
.flash{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);
  z-index:18;font-size:clamp(26px,6vw,54px);font-weight:800;letter-spacing:.04em;
  color:var(--hot2);opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.9,.3,1);
  text-shadow:0 0 34px rgba(255,107,53,.55);white-space:nowrap}
.flash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

@media (max-width:819px){
  .panel{top:64px;left:10px;width:auto;max-width:176px;font-size:11px;padding:10px 11px;
    border-radius:12px}
  .panel h4{font-size:9.5px;margin-bottom:6px}
  .cam{top:64px;right:10px;width:104px;border-radius:11px}
  .cam.off{height:64px}
  .hint{bottom:14px;gap:7px;width:94vw}
  .chip{font-size:11px;padding:6px 10px}
  .hint .desk{display:none}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<header>
  <a class="brand" href="index.html"><span class="mark"><i></i></span>KissCream</a>
  <a class="back" href="index.html">← 返回首页</a>
</header>

<div class="panel">
  <h4>交互状态</h4>
  <div class="row"><span><i class="dot" id="dCam"></i>摄像头</span><b id="tCam">未启动</b></div>
  <div class="row"><span><i class="dot" id="dMdl"></i>手部模型</span><b id="tMdl">待加载</b></div>
  <div class="row"><span><i class="dot" id="dHand"></i>手掌</span><b id="tHand">无</b></div>
  <div class="row s"><span>手势</span><b id="tGes">—</b></div>
  <div class="row"><span>粒子</span><b id="tNum">—</b></div>
  <div class="row"><span>帧率</span><b id="tFps">—</b></div>
</div>

<div class="cam off" id="camBox">
  <video id="v" playsinline muted autoplay></video>
  <span class="cap" id="camCap">摄像头预览</span>
</div>

<div class="flash" id="flash"></div>

<div class="hint">
  <div class="chip"><k>张开</k> 一大团 <em>星云</em>，跟着手掌走</div>
  <div class="chip"><k>握拳</k> 全部粒子聚成 <em>KissCream</em></div>
  <div class="chip desk">手掌移到哪儿，星云就飘到哪儿</div>
  <div class="chip" id="fbChip" style="display:none"><em>无摄像头时：鼠标/手指 = 手掌</em></div>
</div>
<script>
(function(){
'use strict';

//==================== 配置 ====================
var isNarrow = Math.min(window.innerWidth, window.innerHeight) < 820;
var COUNT = isNarrow ? 25000 : 70000;
var NEB_R = isNarrow ? 0.50 : 0.60;      // 星云半径（世界坐标，屏幕高 = 2）

//==================== WebGL 初始化 ====================
var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl2', {antialias:false, alpha:false, depth:false,
  premultipliedAlpha:false, powerPreference:'high-performance'});
if (!gl) {
  document.body.innerHTML = '<div style="display:grid;place-items:center;height:100%;' +
    'color:#8b9aa3;font:14px sans-serif;text-align:center;padding:24px">' +
    '这个浏览器不支持 WebGL2<br>换个新版 Chrome / Edge / Safari 试试</div>';
  return;
}

var VS = [
'#version 300 es',
'precision highp float;',
'in vec2 aHome;',        // 星云局部坐标（中心 0）
'in vec2 aFist;',        // KissCream 文字坐标
'in vec3 aSeed;',
'in float aCore;',       // 星云核心度 0..1
'uniform float uAspect;',
'uniform float uTime;',
'uniform float uMorph;',
'uniform vec2 uFollow;', // 星云跟随手掌的位移
'uniform float uSize;',
'uniform float uDpr;',
'uniform float uCloudR;',
'out vec3 vCol;',
'out float vA;',
'void main(){',
'  float neb = 1.0 - uMorph;',
'  // 星云：缓慢自转（差速：外圈稍慢，看起来在流动）+ 呼吸缩放',
'  float spin = uTime * 0.045;',
'  float cs = cos(spin), sn = sin(spin);',
'  vec2 loc = vec2(cs*aHome.x - sn*aHome.y, sn*aHome.x + cs*aHome.y);',
'  loc *= 1.0 + 0.045 * sin(uTime * 0.55 + aSeed.x * 6.2832);',
'  // 星云内部湍流：非核区抖得厉害，核心稳',
'  loc += vec2(sin(uTime*0.62 + aSeed.x*6.2832), cos(uTime*0.48 + aSeed.y*6.2832))',
'         * (0.014 + 0.026 * (1.0 - aCore));',
'  loc += uFollow;',
'  // 文字：轻微呼吸抖动，固定在屏幕中心',
'  vec2 txt = aFist + vec2(sin(uTime*0.9 + aSeed.y*6.2832),',
'                          cos(uTime*0.8 + aSeed.z*6.2832)) * 0.0035;',
'  vec2 p = mix(loc, txt, uMorph);',
'  gl_Position = vec4(p.x / uAspect, p.y, 0.0, 1.0);',
'  float rad = length(aHome) / uCloudR;',
'  float outer = smoothstep(0.26, 1.05, rad);',
'  // 两段伪噪声：造丝状亮纹与暗缝，避免整团变成均匀噪点',
'  float nz = 0.5 + 0.5*sin(aHome.x*6.2 + aHome.y*4.7 + aSeed.x*6.2832);',
'  nz *= 0.5 + 0.5*sin(aHome.y*10.5 - aHome.x*3.9 + aSeed.y*6.2832);',
'  nz = 0.28 + 1.20*nz;',
'  // 6% 粒子做成大而极淡的光斑 → 出柔光晕',
'  float puff = step(0.90, fract(aSeed.x*7.31 + aSeed.y*3.17));',
'  float sizeMulN = (0.44 + 0.30*aSeed.z + 0.58*aCore + 0.85*outer) * mix(1.0, 7.0, puff);',
'  float alphaMulN = (0.30 + 0.22*aSeed.z + 0.48*aCore) * (1.0 - 0.30*outer) * nz',
'                    * mix(1.0, 0.062, puff);',
'  float sizeMul = mix(sizeMulN, 0.62 + 0.62*aSeed.z, uMorph);',
'  gl_PointSize = uSize * uDpr * sizeMul;',
'  float alphaMul = mix(alphaMulN, 0.34 + 0.34*aSeed.z, uMorph);',
'  // 配色：核心暖白 → 中层蓝白 → 外晕淡紫',
'  vec3 warm = vec3(1.00, 0.80, 0.60);',
'  vec3 mid  = vec3(0.88, 0.92, 1.00);',
'  vec3 cold = vec3(0.42, 0.50, 1.00);',
'  vec3 nebCol = mix(cold, mid, smoothstep(0.0, 0.42, aCore));',
'  nebCol = mix(nebCol, warm, smoothstep(0.55, 1.0, aCore));',
'  vec3 txtCol = vec3(0.93, 0.96, 1.00);',
'  vCol = mix(nebCol, txtCol, uMorph);',
'  vA = alphaMul;',
'}'
].join('\n');

var FS = [
'#version 300 es',
'precision highp float;',
'in vec3 vCol;',
'in float vA;',
'uniform float uBright;',
'out vec4 outColor;',
'void main(){',
'  vec2 q = gl_PointCoord - 0.5;',
'  float r = length(q) * 2.0;',
'  if (r > 1.0) discard;',
'  float a = smoothstep(1.0, 0.10, r);',
'  a *= a;',
'  outColor = vec4(vCol * a * vA * uBright, a * vA * uBright);',
'}'
].join('\n');

function mkShader(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}
var prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error('link: ' + gl.getProgramInfoLog(prog));
gl.useProgram(prog);

var U = {};
['uAspect','uTime','uMorph','uFollow','uSize','uDpr','uCloudR','uBright'].forEach(function(n){
  U[n] = gl.getUniformLocation(prog, n);
});
var A = {};
['aHome','aFist','aSeed','aCore'].forEach(function(n){ A[n] = gl.getAttribLocation(prog, n); });

gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE);
gl.clearColor(0.02, 0.027, 0.039, 1);

//==================== 星云生成 ====================
var TAU = Math.PI * 2;

// 近似高斯：四个均匀分布相加
function gauss(){
  return (Math.random() + Math.random() + Math.random() + Math.random() - 2) * 1.7;
}

// 一大团星云：致密核心 + 几个错落的软云团 + 丝状气流 + 外圈晕
// 返回 [x, y, core]，core∈[0,1] 表示核心程度（用于亮度/尺寸/色温）
function nebula(n, R){
  var out = [];
  var CORE = R * 0.17;
  // 六团错落的云，构成不规则的一大团
  var LOBES = [];
  for (var a = 0; a < 6; a++){
    var ang = (a / 6) * TAU + (Math.random() - 0.5) * 0.6;
    var rr  = R * (0.20 + 0.60 * Math.random());
    LOBES.push({ x: Math.cos(ang) * rr, y: Math.sin(ang) * rr * 0.85,
                 sx: R * (0.26 + 0.26 * Math.random()),
                 sy: R * (0.22 + 0.28 * Math.random()) });
  }
  for (var i = 0; i < n; i++){
    var u = Math.random(), x, y, core;
    if (u < 0.19){
      // 核：致密高斯簇
      x = gauss() * CORE;
      y = gauss() * CORE * 0.92;
      var d0 = Math.sqrt(x*x + y*y);
      core = Math.max(0.60, 1.0 - d0 / (CORE * 1.9));
      x += R * 0.02; y -= R * 0.015;
    } else if (u < 0.80){
      // 云团：随机落在一团云里，椭圆高斯铺开
      var L = LOBES[(Math.random() * LOBES.length) | 0];
      x = L.x + gauss() * L.sx * 0.46;
      y = L.y + gauss() * L.sy * 0.48;
      var rr2 = Math.sqrt(x*x + y*y) / R;
      core = Math.max(0.04, 0.80 - 0.72 * rr2);
    } else if (u < 0.90){
      // 丝状气流：从核往外飘的弯曲线
      var s = Math.random();
      var a2 = Math.random() * TAU + 1.1 * Math.sin(s * 2.4) * 0.5;
      var r2 = CORE * 0.7 + s * R * 0.95;
      x = Math.cos(a2) * r2;
      y = Math.sin(a2) * r2 * 0.86;
      core = Math.max(0.02, 0.46 - 0.40 * s);
    } else {
      // 晕：指数衰减的散尘，把整体撑成「一大团」
      var e = -Math.log(1 - Math.random() * 0.97);
      var r3 = CORE + e * R * 0.46;
      if (r3 > R * 1.40) r3 = R * 1.40 * (0.66 + Math.random() * 0.34);
      var a3 = Math.random() * TAU;
      x = Math.cos(a3) * r3;
      y = Math.sin(a3) * r3 * 0.88;
      core = 0.0;
    }
    out.push([x, y, core]);
  }
  return out;
}
// 采样文字位置（用于「握拳聚合」）
function sampleText(text, maxW, maxH){
  var fs = 200, pad = 40;
  var cv = document.createElement('canvas');
  var cx = cv.getContext('2d');
  cx.font = '800 ' + fs + 'px "Segoe UI","Microsoft YaHei",sans-serif';
  var w = Math.ceil(cx.measureText(text).width);
  cv.width = w + pad * 2; cv.height = fs + pad * 2;
  cx = cv.getContext('2d');
  cx.fillStyle = '#fff';
  cx.font = '800 ' + fs + 'px "Segoe UI","Microsoft YaHei",sans-serif';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText(text, cv.width / 2, cv.height / 2);
  var data = cx.getImageData(0, 0, cv.width, cv.height).data;
  var pts = [];
  for (var y = 0; y < cv.height; y += 2){
    for (var x = 0; x < cv.width; x += 2){
      if (data[(y * cv.width + x) * 4 + 3] > 22) pts.push([x, y]);
    }
  }
  var sc = Math.min(maxW / cv.width, maxH / cv.height);
  return { pts: pts, w: cv.width * sc, h: cv.height * sc, sc: sc };
}

//==================== 粒子数据 ====================
var state = { morph: 0, morphT: 0, time: 0,
              follow: [0, 0], followT: [0, 0], lastHand: -1e9, hasHand: false };
var ges = { last: 'unknown', stable: 0, fired: 0, mode: 'scatter' };

var texFist = sampleText('KissCream', 1.86, 0.62);

var aHome = new Float32Array(COUNT * 2);
var aFist = new Float32Array(COUNT * 2);
var aSeed = new Float32Array(COUNT * 3);
var aCore = new Float32Array(COUNT);

function buildParticles(){
  var tmpl = nebula(Math.min(COUNT, 24000), NEB_R);
  for (var i = 0; i < COUNT; i++){
    var p = tmpl[i % tmpl.length];
    // 弥散取样：同一模板点重复使用也不显规律
    var jr = 0.005 + 0.011 * ((i * 0.6180339887) % 1);
    var ja = i * 2.399963229728653;
    aHome[i*2]   = p[0] + Math.cos(ja) * jr;
    aHome[i*2+1] = p[1] + Math.sin(ja) * jr;
    aCore[i]     = p[2];

    var tp = texFist.pts[(i * 7919) % texFist.pts.length];
    aFist[i*2]   = (tp[0] - texFist.w / texFist.sc / 2) * texFist.sc + (Math.random() - .5) * 0.004;
    aFist[i*2+1] = -(tp[1] - texFist.h / texFist.sc / 2) * texFist.sc + (Math.random() - .5) * 0.004;

    aSeed[i*3]   = Math.random();
    aSeed[i*3+1] = Math.random();
    aSeed[i*3+2] = Math.random();
  }

  function buf(arr, loc, size){
    var b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  }
  buf(aHome, A.aHome, 2);
  buf(aFist, A.aFist, 2);
  buf(aSeed, A.aSeed, 3);
  buf(aCore, A.aCore, 1);
}

//==================== 视口 ====================
var DPR = Math.min(window.devicePixelRatio || 1, isNarrow ? 2 : 1.75);
var aspect = 1.78, brightMul = 1;

function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
  aspect = canvas.width / canvas.height;
  isNarrow = Math.min(w, h) < 820;
  texFist = sampleText('KissCream', aspect * 0.94, 0.42 * (isNarrow ? 1.1 : 1.5));
  buildParticles();
  brightMul = isNarrow ? 1.35 : 1.0;
}

//==================== 手势判定 ====================
// MediaPipe 手部 21 点：0 腕, 4 拇指尖, 8/12/16/20 四指尖, 5/9/13/17 掌指关节
function classify(lm, handed){
  // 用「指骨方向是否连续」判伸展，不受手部旋转影响
  function nrm(v){
    var L = Math.sqrt(v[0]*v[0] + v[1]*v[1]) || 1e-6;
    return [v[0]/L, v[1]/L];
  }
  function straight(mcp, pip, tip){
    var a = nrm([lm[pip].x - lm[mcp].x, lm[pip].y - lm[mcp].y]);
    var b = nrm([lm[tip].x - lm[pip].x, lm[tip].y - lm[pip].y]);
    return a[0]*b[0] + a[1]*b[1];
  }
  var ext = 0, dots = [];
  for (var i = 0; i < 4; i++){
    var mcp = 5 + i*4, pip = 6 + i*4, tip = 8 + i*4;
    var d1 = straight(mcp, pip, tip);
    dots.push(+d1.toFixed(2));
    if (d1 > 0.30) ext++;
  }
  var dThumb = straight(2, 3, 4);
  var thumbOut = dThumb > 0.30;
  if (thumbOut) ext++;
  var g;
  if (ext <= 1) g = 'fist';
  else if (ext >= 5) g = 'open';
  else if (ext <= 3) g = 'mid';
  else g = 'unknown';
  return { g: g, ext: ext, thumb: thumbOut, dots: dots };
}

var HAND_NAMES = { fist: '握拳', open: '张开', mid: '半握', unknown: '—' };
var flashEl = document.getElementById('flash');
var flashTimer = 0;
function flash(txt){
  flashEl.textContent = txt;
  flashEl.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function(){ flashEl.classList.remove('show'); }, 900);
}

function onGesture(g){
  if (g === 'fist' && ges.mode !== 'text'){
    ges.mode = 'text'; state.morphT = 1;
    flash('握拳 · 聚合成字');
  } else if (g === 'open' && ges.mode !== 'scatter'){
    ges.mode = 'scatter'; state.morphT = 0;
    flash('张开 · 星云跟随手掌');
  }
}

function feedLandmarks(lm, handed){
  var r = classify(lm, handed);
  var now = performance.now();
  if (r.g === ges.last) ges.stable++;
  else { ges.last = r.g; ges.stable = 1; }

  if (ges.stable === 3 && now - ges.fired > 700){
    if (r.g === 'fist' || r.g === 'open'){ onGesture(r.g); ges.fired = now; }
  }

  // 手掌中心（镜像后映射到世界坐标）
  var px = 0, py = 0, w = [0, 5, 9, 13, 17];
  for (var i = 0; i < w.length; i++){ px += lm[w[i]].x; py += lm[w[i]].y; }
  px /= w.length; py /= w.length;
  setHand(1 - px, py);
  return r;
}

// nx,ny ∈[0,1] 屏幕比例 → 星云跟随目标（世界坐标）
function setHand(nx, ny){
  var wx = (nx * 2 - 1) * aspect;
  var wy = -(ny * 2 - 1);
  // 别让星云整个跑出画面
  // 跟随用 0.85 的增益：手到画面边缘时，星云仍有一大半留在屏幕里
  var mx = Math.max(0.12, aspect * 0.70), my = 0.58;
  state.followT[0] = Math.max(-mx, Math.min(mx, wx * 0.85));
  state.followT[1] = Math.max(-my, Math.min(my, wy * 0.85));
  state.lastHand = performance.now();
  state.hasHand = true;
}

//==================== 渲染循环 ====================
var lastT = performance.now(), fpsAcc = 0, fpsN = 0, fpsShow = 0;

function draw(){
  var now = performance.now();
  var dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  state.time += dt;

  // 形变缓动
  var k = 1 - Math.exp(-dt * 7.5);
  state.morph += (state.morphT - state.morph) * k;

  // 星云跟随：手还在就紧跟，手丢了就慢慢飘回中心
  var fresh = (now - state.lastHand) < 700;
  if (!fresh){ state.followT[0] = 0; state.followT[1] = 0; state.hasHand = false; }
  var kf = 1 - Math.exp(-dt * (fresh ? 6.0 : 2.4));
  state.follow[0] += (state.followT[0] - state.follow[0]) * kf;
  state.follow[1] += (state.followT[1] - state.follow[1]) * kf;

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(U.uAspect, aspect);
  gl.uniform1f(U.uTime, state.time);
  gl.uniform1f(U.uMorph, state.morph);
  gl.uniform2f(U.uFollow, state.follow[0], state.follow[1]);
  gl.uniform1f(U.uSize, isNarrow ? 2.5 : 2.3);
  gl.uniform1f(U.uDpr, DPR);
  gl.uniform1f(U.uCloudR, NEB_R);
  gl.uniform1f(U.uBright, (isNarrow ? 1.75 : 1.45) * brightMul * (0.90 + 0.45 * state.morph));
  gl.drawArrays(gl.POINTS, 0, COUNT);

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5){
    fpsShow = Math.round(fpsN / fpsAcc);
    fpsAcc = 0; fpsN = 0;
    document.getElementById('tFps').textContent = fpsShow + ' fps';
  }
  requestAnimationFrame(draw);
}

//==================== 鼠标 / 触摸兜底 ====================
var usePointer = true;
canvas.addEventListener('pointermove', function(e){
  if (!usePointer) return;
  setHand(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
});
canvas.addEventListener('pointerdown', function(e){
  if (!usePointer) return;
  setHand(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
  // 兜底：点一下 = 握拳，再点 = 张开
  onGesture(ges.mode === 'scatter' ? 'fist' : 'open');
});
//==================== 摄像头 + MediaPipe ====================
var elD = { cam: document.getElementById('dCam'), mdl: document.getElementById('dMdl'),
            hand: document.getElementById('dHand') };
var elT = { cam: document.getElementById('tCam'), mdl: document.getElementById('tMdl'),
            hand: document.getElementById('tHand'), ges: document.getElementById('tGes'),
            num: document.getElementById('tNum') };
function badge(elm, cls){ elm.className = 'dot ' + (cls || ''); }

var video = document.getElementById('v');
var camBox = document.getElementById('camBox');
var camCap = document.getElementById('camCap');
var landmarker = null;

document.getElementById('tNum').textContent = COUNT.toLocaleString();

async function initHand(){
  badge(elD.mdl, 'warn'); elT.mdl.textContent = '加载中';
  try {
    var vision = await import('./vendor/vision_bundle.js');
    var files = await vision.FilesetResolver.forVisionTasks('./vendor/wasm');
    var opts = function(delegate){
      return {
        baseOptions: { modelAssetPath: './models/hand_landmarker.task', delegate: delegate },
        runningMode: 'VIDEO', numHands: 1,
        minHandDetectionConfidence: 0.55, minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      };
    };
    try {
      landmarker = await vision.HandLandmarker.createFromOptions(files, opts('GPU'));
    } catch (e1) {
      landmarker = await vision.HandLandmarker.createFromOptions(files, opts('CPU'));
    }
    badge(elD.mdl, 'on'); elT.mdl.textContent = '就绪';
    return true;
  } catch (err) {
    badge(elD.mdl, 'err'); elT.mdl.textContent = '失败';
    camCap.textContent = '模型加载失败，已切鼠标模式';
    usePointer = true;
    document.getElementById('fbChip').style.display = '';
    console.warn('[gesture] 手部模型加载失败：', err && err.message);
    return false;
  }
}

async function initCamera(){
  badge(elD.cam, 'warn'); elT.cam.textContent = '启动中';
  try {
    var stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    camBox.classList.remove('off');
    camCap.textContent = '摄像头预览';
    badge(elD.cam, 'on'); elT.cam.textContent = '已启动';
    return true;
  } catch (err) {
    badge(elD.cam, 'err'); elT.cam.textContent = '不可用';
    camCap.textContent = '没有摄像头权限，用鼠标/手指来代替手掌';
    document.getElementById('fbChip').style.display = '';
    console.warn('[gesture] 摄像头不可用：', err && err.name);
    return false;
  }
}

var lastDetect = 0, detectTs = 0;

function detectLoop(){
  requestAnimationFrame(detectLoop);
  if (!landmarker || !video.videoWidth) return;
  var now = performance.now();
  if (now - lastDetect < (fpsShow && fpsShow < 30 ? 60 : 33)) return;
  lastDetect = now;
  var res;
  try {
    res = landmarker.detectForVideo(video, (detectTs += 33));
  } catch (e) { return; }
  if (res && res.landmarks && res.landmarks.length){
    usePointer = false;
    var r = feedLandmarks(res.landmarks[0], res.handedness && res.handedness[0] &&
                          res.handedness[0][0] ? res.handedness[0][0].categoryName : '');
    badge(elD.hand, 'on');
    elT.hand.textContent = '已锁定';
    elT.ges.textContent = HAND_NAMES[r.g] || r.g;
  } else {
    if (!usePointer){
      badge(elD.hand, 'warn');
      elT.hand.textContent = '寻找中';
      elT.ges.textContent = '—';
    }
  }
}

//==================== 自检（?selftest=1，无需摄像头）====================
function selftest(){
  // 构造 21 点：open = 四指全伸；fist = 四指全收
  function make(open){
    var b = [
      [0.50, 0.82],
      [0.42, 0.76],[0.38, 0.72],[0.35, 0.69],[0.32, 0.66],
      [0.44, 0.60],[0.44, 0.52],[0.44, 0.46],[0.44, 0.40],
      [0.50, 0.59],[0.50, 0.50],[0.50, 0.43],[0.50, 0.36],
      [0.56, 0.60],[0.56, 0.52],[0.56, 0.46],[0.56, 0.41],
      [0.62, 0.63],[0.62, 0.56],[0.62, 0.51],[0.62, 0.47]
    ];
    var lm = [];
    for (var i = 0; i < 21; i++) lm.push({ x: b[i][0], y: b[i][1] });
    if (!open){
      for (var f = 0; f < 4; f++){
        var mcp = 5 + f*4;
        lm[mcp+1] = { x: b[mcp][0], y: b[mcp][1] - 0.07 };
        lm[mcp+2] = { x: b[mcp][0], y: b[mcp][1] - 0.05 };
        lm[mcp+3] = { x: b[mcp][0], y: b[mcp][1] - 0.01 };
      }
      lm[3] = { x: 0.42, y: 0.72 }; lm[4] = { x: 0.46, y: 0.70 };
    } else {
      lm[4] = { x: 0.30, y: 0.60 };
    }
    return lm;
  }
  var rOpen = classify(make(true));
  var rFist = classify(make(false));
  var ok = (rOpen.g === 'open') && (rFist.g === 'fist');
  console.log('[selftest] open =>', JSON.stringify(rOpen));
  console.log('[selftest] fist =>', JSON.stringify(rFist));
  console.log('[selftest] classify =', ok ? 'PASS' : 'FAIL');

  // 完整链路：握拳 → 字；张开 → 星云
  onGesture('fist');
  var morphFist = state.morphT, modeFist = ges.mode;
  onGesture('open');
  var morphOpen = state.morphT, modeOpen = ges.mode;
  console.log('[selftest] fist -> morphT', morphFist, 'mode', modeFist);
  console.log('[selftest] open -> morphT', morphOpen, 'mode', modeOpen);

  // 跟随：手掌在右侧 / 左侧，星云目标应该跟着跑
  setHand(0.88, 0.5);
  var fRight = state.followT[0];
  setHand(0.12, 0.5);
  var fLeft = state.followT[0];
  setHand(0.5, 0.14);
  var fUp = state.followT[1];
  console.log('[selftest] follow right', fRight.toFixed(3), 'left', fLeft.toFixed(3),
              'up', fUp.toFixed(3));
  var followOK = (fRight > 0.25) && (fLeft < -0.25) && (fUp > 0.25);

  // 星云数据自检
  var nb = nebula(4000, NEB_R);
  var finite = true, rmax = 0;
  for (var i = 0; i < nb.length; i++){
    if (!isFinite(nb[i][0]) || !isFinite(nb[i][1])) finite = false;
    var rr = Math.sqrt(nb[i][0]*nb[i][0] + nb[i][1]*nb[i][1]);
    if (rr > rmax) rmax = rr;
  }
  console.log('[selftest] nebula finite =', finite, 'rmax =', rmax.toFixed(3),
              '(R =', NEB_R + ')');
  var nebOK = finite && rmax < NEB_R * 1.7 && rmax > NEB_R * 0.5;

  console.log('[selftest] follow =', followOK ? 'PASS' : 'FAIL');
  console.log('[selftest] nebula =', nebOK ? 'PASS' : 'FAIL');
  var all = ok && nebOK && followOK && morphFist === 1 && morphOpen === 0;
  console.log('[selftest] ALL =', all ? 'PASS' : 'FAIL');
  document.title = 'SELFTEST ' + (all ? 'PASS' : 'FAIL');
}

//==================== 启动 ====================
resize();
window.addEventListener('resize', function(){
  clearTimeout(window.__rz);
  window.__rz = setTimeout(resize, 180);
});
requestAnimationFrame(draw);

var q = new URLSearchParams(location.search);
if (q.get('morph') === '1'){ ges.mode = 'text'; state.morph = 1; state.morphT = 1; }
if (q.get('selftest') === '1'){
  setTimeout(selftest, 300);
} else {
  (async function(){
    var camOK = await initCamera();
    var mdlOK = await initHand();
    if (camOK && mdlOK) detectLoop();
  })();
}
})();
</script>

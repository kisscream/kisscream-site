/* ================= 3D 基础 ================= */
const V=(x,y,z)=>({x,y,z});
const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const cross=(a,b)=>V(a.y*b.z-a.z*b.y, a.z*b.x-a.x*b.z, a.x*b.y-a.y*b.x);
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const nrm=a=>{const l=Math.hypot(a.x,a.y,a.z)||1;return V(a.x/l,a.y/l,a.z/l)};

const COL={
  recv:[0.340,0.348,0.364],
  recv2:[0.248,0.256,0.272],
  cover:[0.330,0.340,0.356],
  steel:[0.405,0.418,0.438],
  dark:[0.178,0.182,0.192],
  wood:[0.408,0.216,0.108],
  wood2:[0.352,0.180,0.086],
  bake:[0.212,0.218,0.232]
};

const BLUESET=new Set([COL.dark,COL.wood2,COL.bake]);

/* 青花瓷纹样：程序化生成的钴蓝卷草 + 折枝花 */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const PAT_PPM=4600, PAT_SIZE=1024;
function makePorcelain(color,seed){
  const c=document.createElement('canvas'); c.width=PAT_SIZE; c.height=PAT_SIZE;
  const g=c.getContext('2d');
  const rnd=mulberry(seed);
  g.strokeStyle=color; g.fillStyle=color; g.lineCap='round'; g.lineJoin='round';
  const petal=(x,y,r,rot)=>{
    g.lineWidth=3.0;
    for(let k=0;k<5;k++){
      const a=rot+k*Math.PI*2/5;
      g.beginPath();
      g.ellipse(x+Math.cos(a)*r*0.55, y+Math.sin(a)*r*0.55, r*0.40, r*0.23, a, 0, Math.PI*2);
      g.stroke();
    }
    g.beginPath(); g.arc(x,y,r*0.16,0,Math.PI*2); g.fill();
  };
  const spiral=(x,y,r,rot,turns)=>{
    g.lineWidth=3.4;
    g.beginPath();
    for(let s=0;s<=1.0001;s+=0.02){
      const a=rot+s*turns*Math.PI*2, rr=r*(1-s*0.85);
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      if(s===0) g.moveTo(px,py); else g.lineTo(px,py);
    }
    g.stroke();
  };
  const leaf=(x,y,r,rot)=>{ g.beginPath(); g.ellipse(x,y,r,r*0.36,rot,0,Math.PI*2); g.fill(); };
  for(let i=0;i<26;i++){
    const x=rnd()*PAT_SIZE, y=rnd()*PAT_SIZE, r=40+rnd()*70, a0=rnd()*Math.PI*2;
    g.lineWidth=4.2;
    g.beginPath(); g.arc(x,y,r,a0,a0+1.4+rnd()*1.2); g.stroke();
    for(let k=0;k<6;k++){
      const a=a0+0.15+k*0.24+rnd()*0.1;
      leaf(x+Math.cos(a)*(r+9), y+Math.sin(a)*(r+9), 7+rnd()*6, a);
    }
  }
  for(let i=0;i<34;i++) spiral(rnd()*PAT_SIZE, rnd()*PAT_SIZE, 14+rnd()*20, rnd()*6, 1.3+rnd()*0.7);
  for(let i=0;i<22;i++){
    const x=rnd()*PAT_SIZE, y=rnd()*PAT_SIZE, r=rnd()*12+12, a=rnd()*Math.PI*2;
    g.lineWidth=3.2;
    g.beginPath(); g.moveTo(x,y);
    g.quadraticCurveTo(x+Math.cos(a)*r*1.8, y+Math.sin(a)*r*1.8, x+Math.cos(a)*r*3.2, y+Math.sin(a)*r*2.9);
    g.stroke();
    petal(x,y,r,a);
    leaf(x+Math.cos(a+1.1)*r*2.0, y+Math.sin(a+1.1)*r*2.0, r*0.6, a+1.1);
    leaf(x+Math.cos(a-0.9)*r*2.4, y+Math.sin(a-0.9)*r*2.4, r*0.5, a-0.9);
  }
  for(let i=0;i<50;i++){ g.beginPath(); g.arc(rnd()*PAT_SIZE, rnd()*PAT_SIZE, 1.6+rnd()*1.8, 0, Math.PI*2); g.fill(); }
  return c;
}
const PAT_DARK=makePorcelain('rgba(24,52,132,0.95)',20261024);
const PAT_LIGHT=makePorcelain('rgba(238,243,248,0.92)',777123);

function box(x0,x1,y0,y1,z0,z1,base,metal){
  const p=(x,y,z)=>V(x,y,z);
  return [
    {v:[p(x0,y0,z0),p(x1,y0,z0),p(x1,y1,z0),p(x0,y1,z0)],base,metal},
    {v:[p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)],base,metal},
    {v:[p(x0,y0,z0),p(x0,y1,z0),p(x0,y1,z1),p(x0,y0,z1)],base,metal},
    {v:[p(x1,y0,z0),p(x1,y1,z0),p(x1,y1,z1),p(x1,y0,z1)],base,metal},
    {v:[p(x0,y0,z0),p(x1,y0,z0),p(x1,y0,z1),p(x0,y0,z1)],base,metal},
    {v:[p(x0,y1,z0),p(x1,y1,z0),p(x1,y1,z1),p(x0,y1,z1)],base,metal}
  ];
}

/* 两端截面不同的棱柱（沿 X 轴），用于枪托/护木/握把等 */
function ringBox(x0,x1,A,B,base,metal){
  const P=(x,r)=>[V(x,r.y0,r.z0),V(x,r.y0,r.z1),V(x,r.y1,r.z1),V(x,r.y1,r.z0)];
  const a=P(x0,A), b=P(x1,B);
  const f=[];
  for(let k=0;k<4;k++){
    const k2=(k+1)%4;
    f.push({v:[a[k],a[k2],b[k2],b[k]],base,metal});
  }
  f.push({v:a,base,metal});
  f.push({v:b,base,metal});
  return f;
}

function sweepX(secs,base,metal){
  const ring=(s)=>[V(s.x,s.y0,s.z0),V(s.x,s.y0,s.z1),V(s.x,s.y1,s.z1),V(s.x,s.y1,s.z0)];
  const f=[];
  for(let i=0;i<secs.length-1;i++){
    const a=ring(secs[i]), b=ring(secs[i+1]);
    for(let k=0;k<4;k++){
      const k2=(k+1)%4;
      f.push({v:[a[k],a[k2],b[k2],b[k]],base,metal});
    }
  }
  f.push({v:ring(secs[0]),base,metal});
  f.push({v:ring(secs[secs.length-1]),base,metal});
  return f;
}
function sweepY(secs,base,metal){
  const ring=(s)=>[V(s.x0,s.y,s.z0),V(s.x0,s.y,s.z1),V(s.x1,s.y,s.z1),V(s.x1,s.y,s.z0)];
  const f=[];
  for(let i=0;i<secs.length-1;i++){
    const a=ring(secs[i]), b=ring(secs[i+1]);
    for(let k=0;k<4;k++){
      const k2=(k+1)%4;
      f.push({v:[a[k],a[k2],b[k2],b[k]],base,metal});
    }
  }
  f.push({v:ring(secs[0]),base,metal});
  f.push({v:ring(secs[secs.length-1]),base,metal});
  return f;
}
function taperX(x0,x1,y,z,r0,r1,seg,base,metal){
  const f=[];
  for(let i=0;i<seg;i++){
    const a0=i/seg*Math.PI*2, a1=(i+1)/seg*Math.PI*2;
    const p0=V(x0,y+r0*Math.cos(a0),z+r0*Math.sin(a0));
    const p1=V(x0,y+r0*Math.cos(a1),z+r0*Math.sin(a1));
    const q0=V(x1,y+r1*Math.cos(a0),z+r1*Math.sin(a0));
    const q1=V(x1,y+r1*Math.cos(a1),z+r1*Math.sin(a1));
    f.push({v:[p0,p1,q1,q0],base,metal});
    f.push({v:[V(x0,y,z),p0,p1],base,metal});
    f.push({v:[V(x1,y,z),q0,q1],base,metal});
  }
  return f;
}
function cylX(x0,x1,y,z,r,seg,base,metal){
  const f=[];
  const pts=[];
  for(let i=0;i<seg;i++){
    const t=i/seg*Math.PI*2;
    pts.push({y:y+r*Math.cos(t), z:z+r*Math.sin(t)});
  }
  for(let i=0;i<seg;i++){
    const p=pts[i], q=pts[(i+1)%seg];
    f.push({v:[V(x0,p.y,p.z),V(x0,q.y,q.z),V(x1,q.y,q.z),V(x1,p.y,p.z)],base,metal});
  }
  for(let i=0;i<seg;i++){
    const p=pts[i], q=pts[(i+1)%seg];
    f.push({v:[V(x0,y,z),V(x0,p.y,p.z),V(x0,q.y,q.z)],base,metal});
    f.push({v:[V(x1,y,z),V(x1,p.y,p.z),V(x1,q.y,q.z)],base,metal});
  }
  return f;
}

/* 上机匣盖：梯形棱柱 */
function prismX(x0,x1,prof,base,metal){
  const f=[];
  for(let i=0;i<prof.length;i++){
    const a=prof[i], b=prof[(i+1)%prof.length];
    f.push({v:[V(x0,a[1],a[0]),V(x0,b[1],b[0]),V(x1,b[1],b[0]),V(x1,a[1],a[0])],base,metal});
  }
  let cz=0,cy=0; prof.forEach(p=>{cz+=p[0];cy+=p[1];}); cz/=prof.length; cy/=prof.length;
  for(let i=0;i<prof.length;i++){
    const a=prof[i], b=prof[(i+1)%prof.length];
    f.push({v:[V(x0,cy,cz),V(x0,a[1],a[0]),V(x0,b[1],b[0])],base,metal});
    f.push({v:[V(x1,cy,cz),V(x1,a[1],a[0]),V(x1,b[1],b[0])],base,metal});
  }
  return f;
}

function rotZ(faces,ang,pivot){
  const c=Math.cos(ang), s=Math.sin(ang);
  const R=p=>{const dx=p.x-pivot.x, dy=p.y-pivot.y;
    return V(pivot.x+dx*c-dy*s, pivot.y+dx*s+dy*c, p.z);};
  return faces.map(f=>({v:f.v.map(R), base:f.base, metal:f.metal}));
}

/* 弹匣：沿贝塞尔脊线扫掠的香蕉形 */
function buildMag(){
  const P0=V(0.108,-0.028), P1=V(0.088,-0.170), P2=V(0.158,-0.292);
  const N=11, hw=0.0175;
  const rings=[];
  for(let i=0;i<=N;i++){
    const s=i/N, a=1-s;
    const x=a*a*P0.x+2*a*s*P1.x+s*s*P2.x;
    const y=a*a*P0.y+2*a*s*P1.y+s*s*P2.y;
    const tx=2*a*(P1.x-P0.x)+2*s*(P2.x-P1.x);
    const ty=2*a*(P1.y-P0.y)+2*s*(P2.y-P1.y);
    const tl=Math.hypot(tx,ty)||1;
    const nx=-ty/tl, ny=tx/tl;
    const th=0.0330*(1-0.10*s);
    const w=hw*(1-0.12*s);
    rings.push([
      V(x+nx*th,y+ny*th,-w), V(x-nx*th,y-ny*th,-w),
      V(x-nx*th,y-ny*th, w), V(x+nx*th,y+ny*th, w)
    ]);
  }
  const f=[];
  for(let i=0;i<N;i++){
    for(let k=0;k<4;k++){
      const k2=(k+1)%4;
      f.push({v:[rings[i][k],rings[i][k2],rings[i+1][k2],rings[i+1][k]],base:COL.bake,metal:0.30});
    }
  }
  f.push({v:rings[0],base:COL.bake,metal:0.30});
  f.push({v:rings[N],base:COL.bake,metal:0.30});
  return f;
}

/* ================= 部件 ================= */
const PARTS=[];
function add(o){
  let cx=0,cy=0,cz=0,n=0;
  o.faces.forEach(f=>f.v.forEach(p=>{cx+=p.x;cy+=p.y;cz+=p.z;n++;}));
  o.cent=V(cx/n,cy/n,cz/n);
  PARTS.push(o);
}

/* 弹匣：带加强筋的香蕉形扫掠 */
function buildMag(){
  const P0=V(0.106,-0.028), P1=V(0.088,-0.168), P2=V(0.158,-0.290);
  const N=15, hw=0.0190;
  const rings=[];
  for(let i=0;i<=N;i++){
    const s=i/N, a=1-s;
    const x=a*a*P0.x+2*a*s*P1.x+s*s*P2.x;
    const y=a*a*P0.y+2*a*s*P1.y+s*s*P2.y;
    const tx=2*a*(P1.x-P0.x)+2*s*(P2.x-P1.x);
    const ty=2*a*(P1.y-P0.y)+2*s*(P2.y-P1.y);
    const tl=Math.hypot(tx,ty)||1;
    const nx=-ty/tl, ny=tx/tl;
    const th=0.0360-0.0045*s;
    const rib=1+0.030*Math.sin(i*2.2);
    const w=hw*(1-0.10*s)*rib;
    rings.push([
      V(x+nx*th,y+ny*th,-w), V(x-nx*th,y-ny*th,-w),
      V(x-nx*th,y-ny*th, w), V(x+nx*th,y+ny*th, w)
    ]);
  }
  const f=[];
  for(let i=0;i<N;i++){
    for(let k=0;k<4;k++){
      const k2=(k+1)%4;
      f.push({v:[rings[i][k],rings[i][k2],rings[i+1][k2],rings[i+1][k]],base:COL.bake,metal:0.28});
    }
  }
  f.push({v:rings[0],base:COL.bake,metal:0.28});
  f.push({v:rings[N],base:COL.bake,metal:0.28});
  return f;
}

/* ================= 足球：截角二十面体 ================= */
const BALL_R=0.110;
const ICOV=[], ICOF=[];
(function(){
  const p=(1+Math.sqrt(5))/2;
  const raw=[[0,1,p],[0,-1,p],[0,1,-p],[0,-1,-p],[1,p,0],[-1,p,0],[1,-p,0],[-1,-p,0],[p,0,1],[-p,0,1],[p,0,-1],[-p,0,-1]];
  raw.forEach(q=>ICOV.push(nrm(V(q[0],q[1],q[2]))));
  const D=(a,b)=>Math.hypot(ICOV[a].x-ICOV[b].x, ICOV[a].y-ICOV[b].y, ICOV[a].z-ICOV[b].z);
  let dmin=1e9;
  for(let i=0;i<12;i++) for(let j=i+1;j<12;j++){ const d=D(i,j); if(d<dmin) dmin=d; }
  const eps=dmin*1.02;
  for(let i=0;i<12;i++) for(let j=i+1;j<12;j++){
    if(D(i,j)>eps) continue;
    for(let k=j+1;k<12;k++){
      if(D(i,k)>eps || D(j,k)>eps) continue;
      ICOF.push([i,j,k]);
    }
  }
})();
const NB=ICOV.map(()=>[]);
ICOF.forEach(f=>{ for(let k=0;k<3;k++){ const a=f[k], b=f[(k+1)%3];
  if(NB[a].indexOf(b)<0) NB[a].push(b);
  if(NB[b].indexOf(a)<0) NB[b].push(a); } });
function aroundOrder(a){
  const n=ICOV[a];
  const ref=nrm(cross(n, Math.abs(n.y)<0.9?V(0,1,0):V(1,0,0)));
  const ref2=cross(n,ref);
  return NB[a].slice().sort((p,q)=>{
    const dp=ICOV[p], dq=ICOV[q];
    return Math.atan2(dot(dp,ref2),dot(dp,ref)) - Math.atan2(dot(dq,ref2),dot(dq,ref));
  });
}
const ICO_N=Math.sqrt((5+4/Math.sqrt(5))/9);
const cutP=(a,b)=>V((2*ICOV[a].x+ICOV[b].x)/3*BALL_R/ICO_N,
                    (2*ICOV[a].y+ICOV[b].y)/3*BALL_R/ICO_N,
                    (2*ICOV[a].z+ICOV[b].z)/3*BALL_R/ICO_N);

const C_BLACK=[0.085,0.085,0.092], C_WHITE=[0.820,0.818,0.808];

function polyPart(name,label,poly,color,exScale){
  let c=V(0,0,0);
  poly.forEach(q=>{ c.x+=q.x; c.y+=q.y; c.z+=q.z; });
  c=V(c.x/poly.length, c.y/poly.length, c.z/poly.length);
  /* 按绕质心的极角排序，保证多边形不自交（消除缺口） */
  const pn=nrm(c);
  const pex=nrm(cross(pn, Math.abs(pn.y)<0.9?V(0,1,0):V(1,0,0)));
  const pey=cross(pn,pex);
  poly=poly.slice().sort((A,B)=>{
    const a=Math.atan2(dot(sub(A,c),pey),dot(sub(A,c),pex));
    const b=Math.atan2(dot(sub(B,c),pey),dot(sub(B,c),pex));
    return a-b;
  });
  const dir=nrm(c);
  const RS=BALL_R*0.999;                 // 拼片贴合球面半径
  const N=poly.length, STEPS=5;
  const rings=[];
  for(let s=1;s<=STEPS;s++){
    const tt=s/STEPS;
    rings.push(poly.map(q=>{
      const x=c.x+(q.x-c.x)*1.004*tt, y=c.y+(q.y-c.y)*1.004*tt, z=c.z+(q.z-c.z)*1.004*tt;
      const d=Math.hypot(x,y,z)||1;
      return V(x/d*RS, y/d*RS, z/d*RS);
    }));
  }
  const apex=V(dir.x*RS, dir.y*RS, dir.z*RS);
  const faces=[];
  for(let i=0;i<N;i++) faces.push({v:[apex, rings[0][i], rings[0][(i+1)%N]], base:color, metal:0.06});
  for(let s=0;s<STEPS-1;s++){
    for(let i=0;i<N;i++){
      const a=rings[s][i], b=rings[s][(i+1)%N], c2=rings[s+1][(i+1)%N], d2=rings[s+1][i];
      faces.push({v:[a,b,c2,d2], base:color, metal:0.06});
    }
  }
  add({name,label:label||'',ex:[dir.x*exScale,dir.y*exScale,dir.z*exScale],faces});
  PARTS[PARTS.length-1].cent=V(0,0,0);PARTS[PARTS.length-1].anchor=apex;

}

/* 12 块五边形 */
ICOV.forEach((nv,i)=>{
  const order=aroundOrder(i);
  const poly=order.map(j=>cutP(i,j));

function domeLayer(name,label,r,color,metal,ex,rib){
  const faces=[];
  const SU=40, SV=13;
  const pt=(i,j)=>{
    const ph=(j/SV)*(Math.PI/2), th=i/SU*Math.PI*2;
    const rr=r*(rib?(1+0.010*Math.sin(j*2.4)):1);
    return V(rr*Math.sin(ph)*Math.cos(th), rr*Math.cos(ph), rr*Math.sin(ph)*Math.sin(th));
  };
  for(let j=0;j<SV;j++) for(let i=0;i<SU;i++){
    const a=pt(i,j), b=pt(i+1,j), c=pt(i+1,j+1), d=pt(i,j+1);
    faces.push({v:[a,b,c,d],base:color,metal});
  }
  add({name,label,ex,faces});
  PARTS[PARTS.length-1].cent=V(0,0,0);
  PARTS[PARTS.length-1].anchor=V(0,r*0.55,0);
}

function makeCam(az,el,dist,tx,cx,cy){
  const cam=V(dist*Math.cos(el)*Math.sin(az), dist*Math.sin(el)+0.03, dist*Math.cos(el)*Math.cos(az));
  const tgt=V(tx||0,-0.025,0);
  const f=nrm(sub(tgt,cam));
  const r=nrm(cross(f,V(0,1,0)));
  const u=cross(r,f);
  const CX=(cx===undefined?W/2:cx), CY=(cy===undefined?H/2:cy);
  return {cam,r,u,f,focal:1250,
    proj(p){const d=sub(p,cam);const z=dot(d,f); if(z<0.10)return null;
      const x=dot(d,r), y=dot(d,u);
      return {x:CX+x/z*1250, y:CY-y/z*1250, z:z};},
    dirTo(p){return nrm(sub(cam,p));}
  };
}

/* ================= 缓动 ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const lerp=(a,b,t)=>a+(b-a)*t;

function partFactor(t,key,retK){
  const s=START[key];
  let e=smooth((t-s)/1.15);
  if(retK>0) e*=1-smooth(retK);
  return clamp(e,0,1);
}

const bg=document.createElement('canvas'); bg.width=W; bg.height=H;
let grassOK=false;
const grassImg=new Image();
function paintBG(){
  const g=bg.getContext('2d');
  const hz=H*0.40;
  let sd=20261025;
  const rnd=()=>{ sd=(sd*1664525+1013904223)&0x7fffffff; return sd/0x7fffffff; };

  const sky=g.createLinearGradient(0,0,0,hz);
  sky.addColorStop(0,'#03060a'); sky.addColorStop(0.65,'#060c11'); sky.addColorStop(1,'#0a1511');
  g.fillStyle=sky; g.fillRect(0,0,W,hz);

  /* 草坪 */
  if(grassOK){
    const N=72;
    for(let i=0;i<N;i++){
      const t0=i/N, t1=(i+1)/N;
      const y0=hz+(H-hz)*Math.pow(t0,1.55);
      const y1=hz+(H-hz)*Math.pow(t1,1.55);
      if(y1-y0<0.6) continue;
      const t=(t0+t1)/2;
      const dh=y1-y0+1;
      const sh=Math.max(40, grassImg.height*(0.30-0.20*t));
      const sy=grassImg.height*(0.10+0.55*t);
      const tileW=W*(1.55-0.95*t);
      const reps=Math.ceil(W/tileW)+2;
      for(let k=0;k<reps;k++){
        const dx=k*tileW - tileW*0.5 - (i%2?tileW*0.35:0);
        g.drawImage(grassImg, 0, Math.min(sy,grassImg.height-4), grassImg.width, Math.min(sh,grassImg.height-sy-2),
                    dx, y0, tileW+1, dh);
      }
      /* 远近明暗 */
      g.fillStyle='rgba(6,16,10,'+(0.10*(1-t)).toFixed(3)+')';
      g.fillRect(0,y0,W,dh);
    }
  }else{
    const grd=g.createLinearGradient(0,hz,0,H);
    grd.addColorStop(0,'#2c5c33'); grd.addColorStop(1,'#4a9042');
    g.fillStyle=grd; g.fillRect(0,hz,W,H-hz);
    for(let i=0;i<14000;i++){
      const yy=hz+Math.pow(rnd(),0.72)*(H-hz), tt=(yy-hz)/(H-hz), xx=rnd()*W;
      const len=1+tt*6, sh=(rnd()-0.5)*26;
      const gg=Math.max(0,Math.min(255,Math.round(96+54*tt+sh)));
      g.strokeStyle='rgba('+Math.round(gg*0.42+18)+','+gg+','+Math.round(gg*0.34+10)+','+(0.05+rnd()*0.13).toFixed(3)+')';
      g.lineWidth=0.9+tt*1.1;
      g.beginPath(); g.moveTo(xx,yy); g.lineTo(xx+(rnd()-0.5)*2.4,yy-len); g.stroke();
    }
  }

  g.fillStyle='rgba(110,210,110,0.05)'; g.fillRect(0,hz,W,H-hz);
  /* 割草条纹 */
  for(let i=0;i<16;i++){
    const t0=Math.pow(i/16,1.5), t1=Math.pow((i+1)/16,1.5);
    const y0=hz+(H-hz)*t0, y1=hz+(H-hz)*t1;
    g.fillStyle=(i%2)?'rgba(235,255,225,0.045)':'rgba(0,25,0,0.06)';
    g.fillRect(0,y0,W,y1-y0);
  }

  /* 白线 */
  const vpx=W*0.5;
  const halfAt=(y)=>46+((y-hz)/(H-hz))*1450;
  g.strokeStyle='rgba(238,246,236,0.72)';
  g.lineWidth=2.6; g.lineCap='round';
  g.shadowColor='rgba(0,0,0,0.55)'; g.shadowBlur=6; g.shadowOffsetY=2;
  g.beginPath(); g.moveTo(vpx-halfAt(hz),hz); g.lineTo(vpx-halfAt(H),H); g.stroke();
  g.beginPath(); g.moveTo(vpx+halfAt(hz),hz); g.lineTo(vpx+halfAt(H),H); g.stroke();
  const yMid=hz+(H-hz)*0.46;
  g.beginPath(); g.moveTo(vpx-halfAt(yMid),yMid); g.lineTo(vpx+halfAt(yMid),yMid); g.stroke();
  const cr=halfAt(yMid)*0.30, cry=cr*0.26;
  g.beginPath(); g.ellipse(vpx,yMid,cr,cry,0,0,Math.PI*2); g.stroke();
  const yb=hz+(H-hz)*0.86;
  g.beginPath();
  g.moveTo(vpx-halfAt(yb)*0.42,yb); g.lineTo(vpx+halfAt(yb)*0.42,yb);
  g.lineTo(vpx+halfAt(H)*0.62,H); g.lineTo(vpx-halfAt(H)*0.62,H);
  g.closePath(); g.stroke();
  g.shadowBlur=0; g.shadowOffsetY=0;

  /* 雾 + 灯光 + 暗角 */
  const fog=g.createLinearGradient(0,hz-30,0,hz+120);
  fog.addColorStop(0,'rgba(10,18,14,0)'); fog.addColorStop(0.45,'rgba(12,22,16,0.66)'); fog.addColorStop(1,'rgba(12,22,16,0)');
  g.fillStyle=fog; g.fillRect(0,hz-30,W,150);
  const lt=g.createRadialGradient(W*0.5,hz+20,20,W*0.5,hz+20,W*0.72);
  lt.addColorStop(0,'rgba(215,255,210,0.16)'); lt.addColorStop(0.5,'rgba(0,0,0,0)'); lt.addColorStop(1,'rgba(0,0,0,0.22)');
  g.fillStyle=lt; g.fillRect(0,hz,W,H-hz);
  const botd=g.createLinearGradient(0,H*0.70,0,H);
  botd.addColorStop(0,'rgba(3,9,6,0)'); botd.addColorStop(1,'rgba(2,6,4,0.30)');
  g.fillStyle=botd; g.fillRect(0,H*0.70,W,H*0.30);
  const vg=g.createRadialGradient(W*0.5,H*0.46,H*0.16,W*0.5,H*0.5,H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0.00)'); vg.addColorStop(0.55,'rgba(2,6,8,0.16)'); vg.addColorStop(1,'rgba(0,0,0,0.62)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
}

const FONT='"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
function txt(s,x,y,size,color,weight,align,spacing){
  ctx.font=(weight||400)+' '+size+'px '+FONT;
  ctx.fillStyle=color; ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  if(spacing){ try{ctx.letterSpacing=spacing+'px';}catch(e){} }
  ctx.fillText(s,x,y);
  if(spacing){ try{ctx.letterSpacing='0px';}catch(e){} }
}
function panel(x,y,w,h){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,16);
  ctx.fillStyle='rgba(7,10,13,0.74)'; ctx.fill();
  ctx.strokeStyle='rgba(108,178,198,0.17)'; ctx.lineWidth=1; ctx.stroke();
}
function hline(x0,x1,y,c){ ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.strokeStyle=c; ctx.lineWidth=1; ctx.stroke(); }

/* 把青花纹样按平面投影贴到面片上 */
function paintPattern(q,cam){
  const n=q.nn, p0=q.p0;
  const ax=Math.abs(n.x), ay=Math.abs(n.y), az=Math.abs(n.z);
  let U,V2;
  if(az>=ax&&az>=ay){ U=V(1,0,0); V2=V(0,1,0); }
  else if(ay>=ax){ U=V(1,0,0); V2=V(0,0,1); }
  else { U=V(0,0,1); V2=V(0,1,0); }
  const K=0.05;
  const s0=cam.proj(p0);
  const su=cam.proj(V(p0.x+U.x*K,p0.y+U.y*K,p0.z+U.z*K));
  const sv=cam.proj(V(p0.x+V2.x*K,p0.y+V2.y*K,p0.z+V2.z*K));
  if(!s0||!su||!sv) return;
  const a=(su.x-s0.x)/K/PAT_PPM, b=(su.y-s0.y)/K/PAT_PPM;
  const c=(sv.x-s0.x)/K/PAT_PPM, d=(sv.y-s0.y)/K/PAT_PPM;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const pt of q.pr){ if(pt.x<x0)x0=pt.x; if(pt.y<y0)y0=pt.y; if(pt.x>x1)x1=pt.x; if(pt.y>y1)y1=pt.y; }
  ctx.save();
  ctx.beginPath(); ctx.moveTo(q.pr[0].x,q.pr[0].y);
  for(let i=1;i<q.pr.length;i++) ctx.lineTo(q.pr[i].x,q.pr[i].y);
  ctx.closePath(); ctx.clip();
  const TIL=PAT_SIZE;
  const ox=((Math.round(p0.x*311)+Math.round(p0.y*617)+Math.round(p0.z*211))%TIL+TIL)%TIL;
  const oy=((Math.round(p0.x*173)+Math.round(p0.z*457))%TIL+TIL)%TIL;
  ctx.setTransform(a,b,c,d,s0.x,s0.y);
  ctx.globalAlpha=0.95;
  for(let tu=-1;tu<=1;tu++){
    for(let tv=-1;tv<=1;tv++) ctx.drawImage(q.pat, tu*TIL-ox, tv*TIL-oy);
  }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;
  const sh=Math.max(0,Math.min(0.76,(1.02-q.lum)*0.95));
  if(sh>0.02){
    ctx.globalCompositeOperation='source-atop';
    ctx.fillStyle='rgba(2,5,12,'+sh.toFixed(3)+')';
    ctx.fillRect(x0-2,y0-2,(x1-x0)+4,(y1-y0)+4);
  }
  ctx.restore();
}

const PROG_AT={};
/* —— 左侧放大窗：只画被选中的部件 —— */
function matchIso(name,iso){
  if(!iso) return false;
  if(iso==='panels') return name.charAt(0)==='p'&&(name.charAt(1)==='n'||name.charAt(1)==='h');
  return name===iso;
}
function drawInset(){
  const amt=state.isoAnim||0;
  const iso=state.isolate;
  if(!iso || amt<0.02) return;
  const k=smooth(clamp(amt,0,1));
  const w=300,h=300,px=470,py=330;
  const cx=px+w/2, cy=py+h/2;
  const sc=0.86+0.14*k;

  ctx.save();
  ctx.globalAlpha=k;
  ctx.translate(cx,cy); ctx.scale(sc,sc); ctx.translate(-cx,-cy);

  /* 面板底 */
  ctx.beginPath(); ctx.roundRect(px,py,w,h,14);
  ctx.fillStyle='rgba(5,8,12,0.94)'; ctx.fill();
  ctx.strokeStyle='rgba(255,122,58,'+(0.20+0.35*k)+')'; ctx.lineWidth=1; ctx.stroke();

  /* 内容 */
  ctx.save();
  ctx.beginPath(); ctx.roundRect(px,py,w,h,14); ctx.clip();

  let rad=0.02;
  for(const p of PARTS){
    if(!matchIso(p.name,iso)) continue;
    for(const f of p.faces) for(const v of f.v){
      const d=Math.hypot(v.x,v.y,v.z); if(d>rad) rad=d;
    }
  }
  const dist=rad*2.15*1250/(w*0.90);
  const cam=makeCam(state.az*0.5+0.7, 0.30, dist, 0, cx, cy+6);

  const qs=[];
  for(const p of PARTS){
    if(!matchIso(p.name,iso)) continue;
    for(const face of p.faces){
      const wv=face.v;
      let n=cross(sub(wv[1],wv[0]),sub(wv[2],wv[0]));
      if(Math.hypot(n.x,n.y,n.z)<1e-9) continue;
      n=nrm(n);
      const cen=V((wv[0].x+wv[1].x+wv[2].x)/3,(wv[0].y+wv[1].y+wv[2].y)/3,(wv[0].z+wv[1].z+wv[2].z)/3);
      if(dot(n,sub(cen,p.cent))<0) n=V(-n.x,-n.y,-n.z);
      if(dot(n,sub(cam.cam,cen))<=0) continue;
      const pr=[]; let ok=true;
      for(const v of wv){ const q=cam.proj(v); if(!q){ ok=false; break; } pr.push(q); }
      if(!ok) continue;
      const nv=V(dot(n,cam.r),dot(n,cam.u),dot(n,cam.f));
      const d1=Math.max(0,dot(nv,L1)), d2=Math.max(0,dot(nv,L2));
      const lum=0.16+1.22*d1;
      const rim=d2*d2*0.85;
      const r=Math.min(255,(face.base[0]*lum+0.20*rim)*255|0);
      const g2=Math.min(255,(face.base[1]*lum+0.44*rim)*255|0);
      const b=Math.min(255,(face.base[2]*lum+0.56*rim)*255|0);
      qs.push({pr,z:dot(sub(cen,cam.cam),cam.f),col:'rgb('+r+','+g2+','+b+')'});
    }
  }
  qs.sort((a,b)=>b.z-a.z);
  for(const q of qs){
    ctx.beginPath(); ctx.moveTo(q.pr[0].x,q.pr[0].y);
    for(let i=1;i<q.pr.length;i++) ctx.lineTo(q.pr[i].x,q.pr[i].y);
    ctx.closePath(); ctx.fillStyle=q.col; ctx.fill();
    ctx.strokeStyle=q.col; ctx.lineWidth=0.6; ctx.stroke();
  }

  /* 扫描线 */
  const sy=py+((state.t*70)%h);
  const lg=ctx.createLinearGradient(0,sy-18,0,sy+18);
  lg.addColorStop(0,'rgba(255,150,80,0)');
  lg.addColorStop(0.5,'rgba(255,160,90,0.14)');
  lg.addColorStop(1,'rgba(255,150,80,0)');
  ctx.fillStyle=lg; ctx.fillRect(px,sy-18,w,36);

  ctx.restore();

  /* 四角括号 */
  const L=16;
  ctx.strokeStyle='rgba(255,150,80,'+(0.65+0.35*Math.sin(state.t*3))+')';
  ctx.lineWidth=2;
  [[px,py,1,1],[px+w,py,-1,1],[px,py+h,1,-1],[px+w,py+h,-1,-1]].forEach(c=>{
    ctx.beginPath();
    ctx.moveTo(c[0]+c[2]*L,c[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(c[0],c[1]+c[3]*L);
    ctx.stroke();
  });

  /* 标题 */
  const label=iso==='panels'?'外皮拼片（32 块）':(iso==='lining'?'内衬层':(iso==='carcass'?'缠纱中胎':(iso==='bladder'?'气囊（内胆）':'气嘴 / 阀门')));
  txt('放大查看 / ISOLATED',px+2,py-12,9,'rgba(150,182,196,'+(0.75*k)+')',400,'left',2);
  const bs=ctx.createLinearGradient(0,py+h-54,0,py+h);
  bs.addColorStop(0,'rgba(5,8,12,0)'); bs.addColorStop(1,'rgba(5,8,12,0.92)');
  ctx.fillStyle=bs; ctx.fillRect(px+1,py+h-54,w-2,53);
  txt(label,px+18,py+h-18,16,'rgba(255,182,146,'+k+')',600);
  ctx.restore();
}
function renderFrame(t){
  const f={}; let maxE=0;
  /* 0–50%：统一球形展开；50–100%：逐件继续外扩 */
  const sSph=smooth(clamp(state.prog/50,0,1));
  const sInd=clamp((state.prog-50)/50,0,1);
  let k=0;
  for(const p of PARTS){
    let v;
    if(p.name==='bladder'){ v=0; }
    else{
      const st=((k*0.37)%11)/11;          // 每个部件的错峰起点
      const ind=smooth(clamp((sInd-st)/(1-st*0.6),0,1));
      v=0.42*sSph + 0.58*ind;
    }
    k++;
    f[p.name]=v; if(v>maxE) maxE=v;
  }
  const az=state.az, el=state.el;
  const dist=state.dist*(1+0.55*maxE)*(state.isolate?1.12:1)*S*(MOBILE?1.78:1);
const cam=makeCam(az,el,dist,(state.tx!==undefined?state.tx:0.0)*S, W/2+130*state.isoAnim+(MOBILE?-70:0), H/2);

  ctx.drawImage(bg,0,0);

  /* 地面网格 */
  ctx.save();
  const yFloor=-0.20*S;
  for(let xi=-6;xi<=6;xi++){
    const x=xi*0.11*S;
    const a=cam.proj(V(x,yFloor,-0.34*S)), b=cam.proj(V(x,yFloor,0.34*S));
    if(!a||!b) continue;
    const al=0.055*Math.max(0,1-Math.abs(xi)/7);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle='rgba(96,190,205,'+al.toFixed(3)+')'; ctx.lineWidth=1; ctx.stroke();
  }
  for(let zi=-3;zi<=3;zi++){
    const z=zi*0.11*S;
    const a=cam.proj(V(-0.68*S,yFloor,z)), b=cam.proj(V(0.68*S,yFloor,z));
    if(!a||!b) continue;
    const al=0.05*Math.max(0,1-Math.abs(zi)/4);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle='rgba(96,190,205,'+al.toFixed(3)+')'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.restore();

  /* 地面辉光 */
  const gg=ctx.createRadialGradient(W*0.5,H*0.70,10,W*0.5,H*0.70,520);
  gg.addColorStop(0,'rgba(255,110,45,'+(0.055+0.03*maxE)+')');
  gg.addColorStop(1,'rgba(255,110,45,0)');
  ctx.save(); ctx.translate(W*0.5,H*0.70); ctx.scale(1,0.22); ctx.translate(-W*0.5,-H*0.70);
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(W*0.5,H*0.70,520,0,Math.PI*2); ctx.fill(); ctx.restore();

  /* 收集面片 */
  const quads=[]; const partBB={};
  const iso=state.isolate;
  for(const p of PARTS){
    const e=f[p.name];
    const off=V(p.ex[0]*e,p.ex[1]*e,p.ex[2]*e);
    for(const face of p.faces){
      const wv=face.v.map(v=>V(v.x+off.x,v.y+off.y,v.z+off.z));
      let n=cross(sub(wv[1],wv[0]),sub(wv[2],wv[0]));
      if(Math.hypot(n.x,n.y,n.z)<1e-9) continue;
      n=nrm(n);
      const cen=V(0,0,0);
      wv.forEach(v=>{cen.x+=v.x;cen.y+=v.y;cen.z+=v.z;});
      cen.x/=wv.length; cen.y/=wv.length; cen.z/=wv.length;
      // 朝外修正
      const out=sub(cen,V(p.cent.x+off.x,p.cent.y+off.y,p.cent.z+off.z));
      if(dot(n,out)<0) n=V(-n.x,-n.y,-n.z);
      // 背面剔除
      if(dot(n,sub(cam.cam,cen))<=0.0001) continue;
      const pr=wv.map(v=>cam.proj(v));
      if(pr.some(q=>!q)) continue;
      const nv=V(dot(n,cam.r),dot(n,cam.u),dot(n,cam.f));
      let d1=Math.max(0,dot(nv,L1));
      let d2=Math.max(0,dot(nv,L2));
      let d3=Math.max(0,dot(nv,L3));
      const sp=Math.pow(Math.max(0,dot(nv,HV)),40)*(face.metal||0.3)*1.5;
      const lum=0.15+1.30*d1+0.14*Math.max(0,nv.y);
      let r=face.base[0]*lum, g2=face.base[1]*lum, b=face.base[2]*lum;
      r+=0.075*d3; g2+=0.052*d3; b+=0.040*d3;
      const rim=d2*d2*0.95;
      r+=0.24*rim; g2+=0.50*rim; b+=0.60*rim;
      r+=sp*1.0; g2+=sp*0.97; b+=sp*0.92;
      // 深度雾
      const fz=clamp((dot(sub(cen,cam.cam),cam.f)-0.9)/1.4,0,1);
      r=lerp(r,0.016,fz*0.55); g2=lerp(g2,0.026,fz*0.55); b=lerp(b,0.036,fz*0.55);
      const zz=dot(sub(cen,cam.cam),cam.f);
      const pat=null;
      (function(){ const b=partBB[p.name]||(partBB[p.name]={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9}); for(const q of pr){ if(q.x<b.x0)b.x0=q.x; if(q.y<b.y0)b.y0=q.y; if(q.x>b.x1)b.x1=q.x; if(q.y>b.y1)b.y1=q.y; } })();
      quads.push({pr,n:pr.length,z:zz,rgb:[Math.min(255,r*255|0),Math.min(255,g2*255|0),Math.min(255,b*255|0)],part:p.name,face,pat,nn:n,p0:wv[0],lum});
    }
  }
  quads.sort((a,b)=>b.z-a.z);
  for(const q of quads){
    const BB=partBB[q.part]||{x0:0,y0:0,x1:0,y1:0};
    let bx0=BB.x0,by0=BB.y0,bx1=BB.x1,by1=BB.y1;
    ctx.beginPath();
    ctx.moveTo(q.pr[0].x,q.pr[0].y);
    for(let i=1;i<q.pr.length;i++) ctx.lineTo(q.pr[i].x,q.pr[i].y);
    ctx.closePath();
    const rc=q.rgb;
    const cTop='rgb('+Math.min(255,rc[0]*1.14|0)+','+Math.min(255,rc[1]*1.14|0)+','+Math.min(255,rc[2]*1.15|0)+')';
    const cBot='rgb('+(rc[0]*0.80|0)+','+(rc[1]*0.80|0)+','+(rc[2]*0.82|0)+')';
    let fillS;
    if((by1-by0)>3){
      fillS=ctx.createLinearGradient(bx0,by0,bx0,by1);
      fillS.addColorStop(0,cTop); fillS.addColorStop(1,cBot);
    } else fillS=cTop;
    ctx.fillStyle=fillS; ctx.fill();
    ctx.strokeStyle=fillS; ctx.lineWidth=0.6; ctx.stroke();
    if(q.pat) paintPattern(q,cam);
    const isSel=(state.sel===q.part), isHov=(state.hover===q.part), isIso=(iso&&matchIso(q.part,iso));
    if(isSel||isHov||isIso){
      ctx.beginPath(); ctx.moveTo(q.pr[0].x,q.pr[0].y);
      for(let i=1;i<q.pr.length;i++) ctx.lineTo(q.pr[i].x,q.pr[i].y);
      ctx.closePath();
      ctx.fillStyle='rgba(255,150,70,'+((isSel||isHov)?0.14:0.05)+')'; ctx.fill();
      if(isSel||isHov){ ctx.strokeStyle='rgba(255,170,100,0.75)'; ctx.lineWidth=1; ctx.stroke(); }
    }
    pickList.push(q);
  }

  /* 零件标注：就近放置 + 简单避让 */
  const items=[];
  for(const p of PARTS){
    const e=f[p.name];
    if(e<0.40||!p.label) continue;
    const c0=(p.anchor||p.cent);
    const base=V(c0.x+p.ex[0]*e, c0.y+p.ex[1]*e, c0.z+p.ex[2]*e);
    const pr=cam.proj(base); if(!pr) continue;
    items.push({label:p.label, pr, al:smooth((e-0.40)/0.35)});
  }
  items.sort((a,b)=>a.pr.y-b.pr.y);
  const placed=[];
  ctx.font='500 13px '+FONT;
  for(const it of items){
    const w=ctx.measureText(it.label).width;
    const goRight=it.pr.x<W/2;
    let rx=goRight? it.pr.x+130 : it.pr.x-130-w;
    let ty=it.pr.y-40;
    if(rx<392) rx=392;
    if(rx+w>1528) rx=1528-w;
    if(ty<170) ty=170;
    if(ty>910) ty=910;
    for(let k=0;k<16;k++){
      const hit=placed.some(p=>!(rx+w+14<p.x0 || rx>p.x1+14 || ty+8<p.y0 || ty-22>p.y1));
      if(!hit) break;
      ty+=22;
      if(ty>910){ ty=170; }
    }
    placed.push({x0:rx,x1:rx+w,y0:ty-22,y1:ty+8});
    const ex=goRight? rx-6 : rx+w+6;
    ctx.beginPath(); ctx.moveTo(it.pr.x,it.pr.y); ctx.lineTo(ex,ty-9);
    ctx.strokeStyle='rgba(126,212,226,'+(0.40*it.al)+')'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.arc(it.pr.x,it.pr.y,2.6,0,Math.PI*2);
    ctx.fillStyle='rgba(255,125,60,'+it.al+')'; ctx.fill();
    txt(it.label, goRight? rx : rx+w, ty, 13, 'rgba(230,242,246,'+it.al+')',500, goRight?'left':'right');
  }

  /* ===== UI ===== */
  if(!MOBILE) drawInset();
  const prog=state.prog;

  if(!MOBILE){
  drawTopBar(t);
  drawRightPanel(t);
  drawRail(prog,t);
  }
  if(false){
    const a=smooth((t-18.5)/1.0);
    ctx.fillStyle='rgba(4,6,9,'+(0.88*a)+')'; ctx.fillRect(0,0,W,H);
    txt('AK-47',W/2,H/2-26,96,'rgba(240,246,248,'+a+')',700,'center',6);
    txt('结构解剖 · 7.62×39 mm',W/2,H/2+34,26,'rgba(255,122,58,'+a+')',500,'center',2);
    txt('数字重构演示 · 非真实拆解 · 不含可制造数据',W/2,H/2+78,15,'rgba(160,180,190,'+(0.8*a)+')',400,'center',1);
  }
}

function progressAt(t){
  const k=[[0,8],[3.4,20],[4.6,30],[6.8,42],[8.0,52],[10.6,66],[12.4,80],[15.0,92],[17.6,100],[20,100]];
  if(t<=k[0][0]) return k[0][1];
  for(let i=1;i<k.length;i++){
    if(t<=k[i][0]){
      const a=(t-k[i-1][0])/(k[i][0]-k[i-1][0]);
      return lerp(k[i-1][1],k[i][1],smooth(a));
    }
  }
  return 100;
}

function inPoly(pt,poly){
  let c=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i], b=poly[j];
    if(((a.y>pt.y)!==(b.y>pt.y)) && (pt.x < (b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x)) c=!c;
  }
  return c;
}
function toCanvas(ev){
  const r=cv.getBoundingClientRect();
  const s=MOBILE?Math.max(r.width/W, r.height/H):Math.min(r.width/W, r.height/H);
  const ox=(r.width-W*s)/2, oy=(r.height-H*s)/2;
  return {x:(ev.clientX-r.left-ox)/s, y:(ev.clientY-r.top-oy)/s};
}

/* —— 指针交互 —— */
const ptrs=new Map();
let drag=null, pinch=0;
cv.style.cursor='grab';
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ drag={x:e.clientX,y:e.clientY,moved:0}; cv.style.cursor='grabbing'; }
  else if(ptrs.size===2){ const a=[...ptrs.values()]; pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); }
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    const a=[...ptrs.values()]; const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinch) state.dist=clamp(state.dist*(pinch/d),0.72,2.6);
    pinch=d; return;
  }
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.moved+=Math.abs(dx)+Math.abs(dy);
  drag.x=e.clientX; drag.y=e.clientY;
  state.az+=dx*0.006;
  state.el=clamp(state.el+dy*0.004,-0.30,1.05);
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=0;
  if(drag && drag.moved<5){
    const p=toCanvas(e);
    let hit=null;
    for(let i=pickList.length-1;i>=0;i--){ if(inPoly(p,pickList[i].pr)){ hit=pickList[i].part; break; } }
    const cp=toCanvas(e);
    if(cp.x>W-190 && cp.x<W-44 && cp.y>28 && cp.y<72){
      const a=document.createElement('a');
      a.download='AK47_青花瓷_'+Date.now()+'.png';
      a.href=cv.toDataURL('image/png');
      a.click();
      return;
    }
    state.sel=hit;
    if(hit){
      state.isolate=(state.isolate&&groupOf(state.isolate)===groupOf(hit))?null:groupOf(hit);
      setIso(state.isolate||'all');
      showCard(hit);
    }else{
      card.style.opacity=0;
      if(state.isolate){ state.isolate=null; setIso('all'); }
    }
  }
  if(ptrs.size===0){ drag=null; cv.style.cursor='grab'; }
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
function pickAt(ev){
  const p=toCanvas(ev);
  for(let i=pickList.length-1;i>=0;i--){ if(inPoly(p,pickList[i].pr)) return pickList[i].part; }
  return null;
}
cv.addEventListener('pointermove',ev=>{
  if(drag||ptrs.size>0) return;
  const hit=pickAt(ev);
  if(hit!==state.hover){
    state.hover=hit;
    cv.style.cursor=hit?'pointer':'grab';
  }
});
cv.addEventListener('pointerleave',()=>{ state.hover=null; cv.style.cursor='grab'; });
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  state.dist=clamp(state.dist*Math.exp(e.deltaY*0.0011),0.72,2.6);
},{passive:false});

/* —— 主循环 —— */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  state.t+=dt;
  const iTgt=state.isolate?1:0;
  state.isoAnim+=(iTgt-state.isoAnim)*Math.min(1,dt*9);
  if(state.auto && !drag && ptrs.size===0) state.az+=dt*0.26;
  if(state.prog>=50 && !dlgShown){ dlgShown=true; showDlg(); }
  if(demo.on){
    const k=clamp((now-demo.t0)/4200,0,1);
    state.prog=demo.from+(100-demo.from)*smooth(k);
    syncUI();
    if(k>=1) demo.on=false;
  }
  pickList.length=0;
  renderFrame(state.t);
  requestAnimationFrame(loop);
}
setTimeout(()=>{
  const pn=PARTS.find(p=>p.name==='pn0');

  document.title='DBG parts='+PARTS.length+' faces='+tot+' pn0verts='+(pn?pn.faces.length:0)+' first='+s;
},400);syncUI();
